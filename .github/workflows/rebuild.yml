name: Rebuild published page

on:
  push:
    branches: [main]
    paths:
      - 'course.json'
      - 'src/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: python3 scripts/validate.py
      - name: Build index.html
        run: python3 scripts/build.py
      - name: Check JavaScript syntax
        run: |
          python3 scripts/extract_js.py index.html /tmp/mind_law_app.js
          node --check /tmp/mind_law_app.js
      - name: Commit rebuilt page when needed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: rebuild published mindmap"
          git push