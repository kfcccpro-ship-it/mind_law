name: Validate daily questions

on:
  push:
    paths:
      - 'daily_questions/**'
      - 'scripts/validate_daily_questions.py'
      - '.github/workflows/validate-daily.yml'
  pull_request:
    paths:
      - 'daily_questions/**'
      - 'scripts/validate_daily_questions.py'
      - '.github/workflows/validate-daily.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_daily_questions.py
