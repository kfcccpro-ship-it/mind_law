name: Validate DAY question sets

on:
  push:
    paths:
      - 'daily_questions/**'
      - 'daily/index.html'
      - 'scripts/validate_daily_questions.py'
      - 'scripts/audit_daily_coverage.py'
      - 'scripts/extract_js.py'
      - '.github/workflows/validate-daily.yml'
  pull_request:
    paths:
      - 'daily_questions/**'
      - 'daily/index.html'
      - 'scripts/validate_daily_questions.py'
      - 'scripts/audit_daily_coverage.py'
      - 'scripts/extract_js.py'
      - '.github/workflows/validate-daily.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate_daily_questions.py
      - run: python3 scripts/audit_daily_coverage.py
      - name: Check DAY page JavaScript syntax
        run: |
          python3 scripts/extract_js.py daily/index.html /tmp/day_app.js
          node --check /tmp/day_app.js
