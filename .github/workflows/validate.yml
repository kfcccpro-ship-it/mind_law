name: Validate mind_law

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate course data
        run: python3 scripts/validate.py
      - name: Build page from source
        run: python3 scripts/build.py
      - name: Check JavaScript syntax
        run: |
          python3 scripts/extract_js.py index.html /tmp/mind_law_app.js
          node --check /tmp/mind_law_app.js
