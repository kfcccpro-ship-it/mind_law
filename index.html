<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새마을금고법 학습 마인드맵 · 현행법 점검본</title>
<meta name="description" content="새마을금고법을 구조·학습카드·퀴즈로 익히는 비공식 학습 마인드맵">
<meta name="theme-color" content="#F4F5F7">
<style>
:root{
  --bg:#F4F5F7; --canvas:#EEF0F3; --surface:#FFFFFF;
  --ink:#1A1B1E; --ink2:#6B6F76; --ink3:#A7ABB2;
  --sep:rgba(20,20,25,.08);
  --shadow:0 1px 3px rgba(16,18,24,.06),0 6px 18px rgba(16,18,24,.07);
  --shadow-lg:0 8px 20px rgba(16,18,24,.12),0 30px 70px rgba(16,18,24,.18);
  --ease:cubic-bezier(.22,.9,.32,1);
  --easeSpring:cubic-bezier(.34,1.56,.64,1);
  --font:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  /* 5개 영역 색상 */
  --hA:#3D6CFF; --hA2:#EAF0FF;
  --hB:#0FA968; --hB2:#E6F8EF;
  --hC:#E08A00; --hC2:#FFF3DF;
  --hD:#9552E8; --hD2:#F4EBFF;
  --hE:#E4436A; --hE2:#FFEAF0;
  --root1:#22242B; --root2:#43465A;
}
.present{
  --bg:#06070B; --canvas:#0A0C12; --surface:#14161F;
  --ink:#F3F4F8; --ink2:#9A9EAC; --ink3:#5B5F6C;
  --sep:rgba(255,255,255,.09);
  --shadow:0 2px 8px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  --hA2:rgba(61,108,255,.16); --hB2:rgba(15,169,104,.16);
  --hC2:rgba(224,138,0,.18); --hD2:rgba(149,82,232,.18); --hE2:rgba(228,67,106,.18);
  --root1:#F3F4F8; --root2:#C9CCDA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  overflow:hidden;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  transition:background .5s var(--ease),color .5s var(--ease);
}
:focus-visible{outline:2px solid var(--hA);outline-offset:3px;border-radius:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.55)}65%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 var(--ac-glow)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes burst{to{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:.01ms !important}}

/* ── 헤더 ─────────────────────────────── */
header{
  position:fixed;top:0;left:0;right:0;height:60px;z-index:90;
  display:flex;align-items:center;gap:10px;padding:0 18px;
  padding-top:env(safe-area-inset-top);height:calc(60px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 70%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);transition:background .5s var(--ease),border-color .5s;
}
.brand{font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.brand b{
  background:linear-gradient(90deg,var(--root1),var(--hA),var(--hD),var(--root1));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 9s linear infinite;
}
.brand span{color:var(--ink3);font-weight:500;font-size:12.5px}
.status-pill{display:inline-flex;align-items:center;flex:none;height:30px;padding:0 10px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-size:10.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
.kakao-link{display:inline-flex;align-items:center;gap:6px;flex:none;height:32px;padding:0 11px;border-radius:10px;background:#FEE500;color:#191919;text-decoration:none;font-size:11.5px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap;transition:transform .2s var(--easeSpring),filter .2s}
.kakao-link:hover{transform:translateY(-1px);filter:brightness(.98)}
.kakao-link:active{transform:scale(.97)}
.kakao-link .kdot{width:7px;height:7px;border-radius:50%;background:#191919;flex:none}
@media (max-width:980px){.status-pill{display:none}.brand span{display:none}.legend{max-width:24vw}}
.mobile-landscape{display:none;border:none;background:var(--surface);color:var(--ink);font:inherit;font-weight:800;font-size:11.5px;white-space:nowrap;height:42px;padding:0 11px;border-radius:13px;box-shadow:var(--shadow);cursor:pointer}
#rotateTip{display:none;position:fixed;left:50%;top:50%;z-index:220;transform:translate(-50%,-50%);max-width:min(340px,82vw);padding:18px 20px;border-radius:18px;background:rgba(20,22,31,.94);color:#fff;font-size:15px;font-weight:800;line-height:1.55;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35)}
#rotateTip.on{display:block;animation:fadeUp .25s var(--ease)}
.legend{display:flex;gap:5px;margin-left:14px;overflow-x:auto;scrollbar-width:none;max-width:30vw}
.legend::-webkit-scrollbar{display:none}
.leg{
  border:none;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:700;flex:none;
  padding:6px 11px;border-radius:20px;color:#fff;opacity:.9;letter-spacing:-.01em;
  transition:transform .2s var(--easeSpring),opacity .2s,box-shadow .2s;white-space:nowrap;
}
.leg:hover{opacity:1;transform:translateY(-1px)}
.leg.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px currentColor;opacity:1}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;max-width:60vw}
.tools::-webkit-scrollbar{display:none}
.tbtn.on{background:linear-gradient(135deg,#3D6CFF,#9552E8);color:#fff}
.tbtn{
  border:none;background:var(--surface);color:var(--ink);cursor:pointer;flex:none;
  height:34px;padding:0 14px;border-radius:10px;font-size:12.5px;font-weight:700;
  font-family:inherit;letter-spacing:-.01em;box-shadow:var(--shadow);
  transition:transform .25s var(--easeSpring),opacity .2s,background .3s;
}
.tbtn:hover{opacity:.75}
.tbtn:active{transform:scale(.92)}
.tbtn.icon{width:34px;padding:0;font-size:17px;line-height:1}
.tbtn.present{background:linear-gradient(135deg,#3D6CFF,#9552E8);color:#fff}
.tbtn.present.on{background:linear-gradient(135deg,#E4436A,#E08A00)}

/* ── 캔버스 ───────────────────────────── */
#stage{position:fixed;inset:0;top:0;overflow:hidden;cursor:grab;touch-action:none;background:var(--canvas);
  transition:background .5s var(--ease)}
#stage.drag{cursor:grabbing}
#stage::before{ /* 은은한 그리드 */
  content:"";position:absolute;inset:-2000px;pointer-events:none;opacity:.5;
  background-image:radial-gradient(var(--sep) 1px,transparent 1px);background-size:26px 26px;
}
.present #stage::before{opacity:.35}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;
  transition:transform .55s var(--ease)}
#world.instant{transition:none}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.wire{fill:none;stroke-linecap:round}
.wire.dim{opacity:.08}

.nodewrap{position:absolute;display:flex;align-items:center;animation:popIn .5s var(--easeSpring) both}
.node{
  position:relative;display:flex;align-items:center;gap:10px;
  border-radius:17px;box-shadow:var(--shadow);cursor:pointer;padding:0 18px;
  transition:transform .28s var(--easeSpring),box-shadow .3s var(--ease),opacity .4s,filter .4s;
  white-space:nowrap;width:max-content;
}
.node:hover{transform:translateY(-2px) scale(1.015);box-shadow:var(--shadow-lg)}
.node:active{transform:scale(.98)}
.node .txt{font-weight:700;letter-spacing:-.015em;line-height:1.25;white-space:normal;max-width:100%}
.nodewrap.dim{opacity:.16;filter:saturate(.3)}
.nodewrap.dim .node:hover{transform:none;box-shadow:var(--shadow)}

/* depth별 스타일 */
.node.d0{background:linear-gradient(135deg,var(--root1),var(--root2));height:76px;padding:0 26px;border-radius:22px}
.node.d0 .txt{color:var(--bg);font-size:21px;font-weight:900}
.node.d0 .sub{font-size:11.5px;font-weight:600;opacity:.55;margin-top:3px;color:var(--bg)}

.node.d1{height:58px;color:#fff;font-size:16px;background:var(--ac)}
.node.d1 .txt{font-size:16px}
.node.d1 .cnt{font-size:10.5px;font-weight:800;opacity:.85;background:rgba(255,255,255,.22);
  border-radius:20px;padding:2px 8px;margin-left:2px}

.node.d2{height:50px;background:var(--ac2);color:var(--ink);border:1.5px solid transparent}
.node.d2 .txt{font-size:14.5px;color:var(--ink)}
.node.d2 .dot{width:7px;height:7px;border-radius:50%;background:var(--ac);flex:none}

.node.d3{height:50px;background:var(--surface);border:1.5px solid var(--sep)}
.node.d3 .txt{font-size:13.5px;font-weight:600;color:var(--ink2)}
.node.d3 .sn{flex:none;width:22px;height:22px;border-radius:7px;background:var(--ac2);
  color:var(--ac);font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center}
.node.d3.active{background:var(--ac);border-color:transparent}
.node.d3.active .txt{color:#fff}
.node.d3.active .sn{background:rgba(255,255,255,.28);color:#fff}

.node.active-branch{animation:pulseRing 1.8s var(--ease) infinite}

.toggle{
  position:absolute;top:50%;right:-13px;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;background:var(--surface);
  border:2px solid var(--ac);color:var(--ac);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;cursor:pointer;box-shadow:var(--shadow);z-index:2;
  transition:transform .3s var(--easeSpring),background .2s;
}
.toggle:hover{transform:translateY(-50%) scale(1.15)}
.toggle.open{background:var(--ac);color:#fff}
.node.d0 .toggle{right:-14px;width:30px;height:30px;font-size:12px}

/* 발표모드 전용 확대 */
.present .node.d0 .txt{font-size:26px}
.present .node.d1{height:68px}
.present .node.d1 .txt{font-size:19px}
.present .node.d2{height:58px}
.present .node.d2 .txt{font-size:17px}
.present .node.d3{height:58px}
.present .node.d3 .txt{font-size:16px}
.present .node{box-shadow:0 0 0 1px var(--sep),var(--shadow-lg)}
.present .node.d1,.present .node.d2.active,.present .node.d3.active{
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 55%,transparent),0 0 26px color-mix(in srgb,var(--ac) 45%,transparent),var(--shadow-lg);
}

/* 포커스 해제 버튼 */
#unfocus{
  position:fixed;left:20px;bottom:20px;z-index:55;border:none;cursor:pointer;
  background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:12.5px;
  padding:10px 16px;border-radius:24px;box-shadow:var(--shadow-lg);display:none;align-items:center;gap:8px;
  animation:fadeUp .3s var(--ease);
}
#unfocus.on{display:flex}
#unfocus .x{width:16px;height:16px;border-radius:50%;background:var(--ink3);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:9px}

/* 힌트 */
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;
  font-size:11.5px;color:var(--ink3);font-weight:600;letter-spacing:-.01em;
  background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(8px);
  padding:8px 16px;border-radius:20px;pointer-events:none;transition:opacity .4s}
#hint.hide{opacity:0}
#stepBadge{position:fixed;right:20px;bottom:20px;z-index:55;
  font-size:12px;font-weight:700;color:var(--ink);letter-spacing:-.01em;
  background:var(--surface);box-shadow:var(--shadow-lg);padding:9px 16px;border-radius:24px;
  display:flex;align-items:center;gap:7px;pointer-events:none;max-width:46vw}
#stepBadge b{color:#fff;background:linear-gradient(135deg,#3D6CFF,#9552E8);
  border-radius:20px;padding:2px 9px;font-size:11px}
#stepBadge span{color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes skipFlash{0%{transform:scale(1.14);box-shadow:0 0 0 3px var(--fc)}100%{transform:scale(1);box-shadow:var(--shadow-lg)}}
#stepBadge.skip-fwd{--fc:#3D6CFF;animation:skipFlash .5s var(--easeSpring)}
#stepBadge.skip-back{--fc:#E4436A;animation:skipFlash .5s var(--easeSpring)}

/* ── 모바일 드릴다운 ────────────────────── */
#mobile{position:fixed;inset:0;top:calc(60px + env(safe-area-inset-top));
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;
  padding:0 16px calc(40px + env(safe-area-inset-bottom))}
#crumb{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:12px 0 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);font-size:13px;color:var(--ink2)}
#crumb .back{border:none;background:none;color:var(--hA);font:inherit;font-weight:700;
  cursor:pointer;padding:0;display:flex;align-items:center;gap:3px}
#mtitle{font-size:27px;font-weight:900;letter-spacing:-.03em;margin:6px 0 4px}
#mdesc{font-size:14px;color:var(--ink2);margin:0 0 18px;line-height:1.5}
.mlist{display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;align-items:center;gap:12px;background:var(--surface);
  border-radius:16px;padding:16px 17px;cursor:pointer;box-shadow:var(--shadow);
  border:.5px solid var(--sep);transition:transform .2s var(--easeSpring);animation:fadeUp .4s var(--ease) both}
.mrow:active{transform:scale(.97)}
.mrow .bar{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}
.mrow .mt{font-size:15.5px;font-weight:700;letter-spacing:-.015em;flex:1;line-height:1.35}
.mrow .mc{font-size:11.5px;font-weight:800;color:#fff;background:var(--ac);border-radius:20px;
  padding:3px 9px;flex:none}
.mrow .ar{color:var(--ink3);font-size:16px;flex:none}

/* ── 스마트폰·태블릿 세로 전용 UI ───────────────── */
@media (max-width:1024px) and (orientation:portrait){
  header{
    height:calc(116px + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) 12px 8px;
    display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-rows:52px 48px;
    column-gap:8px;row-gap:6px;align-items:center;overflow:hidden;
  }
  .brand{grid-column:1;grid-row:1;font-size:15px;min-width:0;overflow:hidden}.brand b{overflow:hidden;text-overflow:ellipsis}.brand span,.status-pill{display:none}
  .kakao-link{grid-column:2;grid-row:1;height:42px;padding:0 11px;border-radius:13px;font-size:12px;box-shadow:var(--shadow)}
  .mobile-landscape{display:inline-flex;grid-column:3;grid-row:1;align-items:center;justify-content:center}
  .tools{display:none!important}
  .legend{grid-column:1/-1;grid-row:2;display:flex!important;width:100%;max-width:none;margin:0;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:1px 1px 4px;touch-action:pan-x}
  .legend::-webkit-scrollbar{display:none}
  .leg{min-height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0 13px;border-radius:21px;font-size:13px;font-weight:850;opacity:1;color:#fff!important;scroll-snap-align:start;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .leg.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ac,var(--hA)),0 2px 8px rgba(0,0,0,.18);transform:translateY(-1px)}
  #mobile{top:calc(116px + env(safe-area-inset-top));padding:0 16px calc(48px + env(safe-area-inset-bottom))}
  #crumb{min-height:46px;padding:10px 0 8px;font-size:15px}
  #crumb .back{min-height:42px;padding:0 6px 0 0;font-size:15px}
  #mtitle{font-size:30px;line-height:1.2;margin:9px 0 6px}
  #mdesc{font-size:15.5px;line-height:1.65;margin-bottom:18px}
  .mlist{gap:10px}.mrow{min-height:62px;border-radius:17px;padding:17px 17px}.mrow .bar{width:10px;height:10px}.mrow .mt{font-size:17px;line-height:1.42}.mrow .mc{font-size:12px;padding:4px 10px}.mrow .ar{font-size:19px}
  .sh-title{font-size:26px;line-height:1.3;padding-right:52px}.sh-eyebrow{font-size:12px}.sh-body{padding:22px 20px calc(72px + env(safe-area-inset-bottom))}
  .blk{margin-bottom:28px}.blk h4{font-size:12.5px;margin-bottom:12px}.blk li{font-size:16.5px;line-height:1.68;padding-left:17px}.blk li::before{top:11px;width:6px;height:6px}
  .easy{font-size:16.5px;line-height:1.72;border-radius:17px;padding:17px 18px}
  .recall-list{gap:12px}.recall-card{min-height:70px;border-radius:17px;padding:16px 17px}.recall-q{font-size:16.5px;line-height:1.65}.recall-a{font-size:15.5px;margin-top:11px}.recall-a::before{font-size:11px}.recall-answer{min-width:88px;padding:7px 10px}.recall-hint{font-size:12.5px;margin-top:8px}
  .lawtag{display:block;font-size:14px;line-height:1.6;padding:10px 13px;margin-bottom:12px}.law-list{gap:10px}.law-article{border-radius:15px}.law-article summary{min-height:52px;font-size:15.5px;line-height:1.55;padding:14px}.law-article summary::after{font-size:11.5px}.law-text{padding:16px;font:15.5px/1.82 var(--font);word-break:normal;overflow-wrap:anywhere}
}
@media (max-width:390px) and (orientation:portrait){
  header{padding-left:9px;padding-right:9px;column-gap:6px}.brand{font-size:13.5px}.kakao-link{font-size:11px;padding:0 9px}.mobile-landscape{font-size:11px;padding:0 9px}.leg{font-size:12.5px;padding:0 11px}
}

/* ── 상세 시트 ─────────────────────────── */
#scrim{position:fixed;inset:0;z-index:70;background:rgba(6,7,12,.4);
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease);backdrop-filter:blur(3px)}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;z-index:80;background:var(--surface);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;transition:transform .5s var(--easeSpring);
  top:calc(60px + env(safe-area-inset-top));right:0;bottom:0;width:min(500px,92vw);border-left:.5px solid var(--sep);transform:translateX(101%);
}
#sheet.on{transform:none}
@media (max-width:1024px) and (orientation:portrait){
  #sheet{top:auto;left:0;right:0;bottom:0;width:auto;height:min(94dvh,94vh);
    border-radius:24px 24px 0 0;border-left:none;border-top:.5px solid var(--sep);transform:translateY(101%)}
}
.sh-head{padding:24px 26px 16px;border-bottom:.5px solid var(--sep);flex:none;position:relative}
.grip{display:none}
@media (max-width:1024px) and (orientation:portrait){.grip{display:block;width:42px;height:5px;border-radius:3px;background:var(--sep);margin:9px auto 13px}.sh-head{padding:0 20px 16px}}
.sh-eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ac,var(--hA));margin-bottom:8px}
.sh-title{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.25;margin:0;padding-right:40px}
.sh-close{position:absolute;top:22px;right:22px;width:32px;height:32px;border:none;border-radius:50%;
  background:var(--canvas);color:var(--ink2);font-size:15px;cursor:pointer;transition:transform .2s var(--easeSpring)}
.sh-close:hover{transform:rotate(90deg)}
@media (max-width:1024px) and (orientation:portrait){.sh-close{top:22px;right:18px;width:44px;height:44px;font-size:18px}}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 26px 60px;flex:1}
.blk{margin-bottom:26px;animation:fadeUp .4s var(--ease) both}
.blk h4{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);
  margin:0 0 11px;display:flex;align-items:center;gap:7px}
.blk h4::before{content:"";width:14px;height:2px;background:var(--ac,var(--hA));border-radius:1px}
.blk ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.blk li{font-size:14.5px;line-height:1.55;padding-left:16px;position:relative;letter-spacing:-.012em;color:var(--ink)}
.blk li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;
  background:var(--ac,var(--hA));opacity:.6}
.easy{font-size:14.5px;line-height:1.65;letter-spacing:-.012em;margin:0;background:var(--canvas);
  border-radius:16px;padding:16px 18px;color:var(--ink)}
.lawtag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--canvas);
  border-radius:9px;padding:8px 13px;line-height:1.5;margin-bottom:10px}
.recall-list{display:flex;flex-direction:column;gap:10px}
.recall-card{width:100%;text-align:left;font:inherit;border:1px solid color-mix(in srgb,var(--ac,var(--hA)) 24%,var(--sep));
  background:var(--canvas);color:var(--ink);border-radius:15px;padding:14px 16px;cursor:pointer;
  transition:transform .18s var(--easeSpring),border-color .18s,background .18s}
.recall-card:hover{transform:translateY(-1px);border-color:var(--ac,var(--hA))}
.recall-q{display:block;font-size:14px;font-weight:750;line-height:1.55;letter-spacing:-.012em}
.recall-a{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;font-weight:900;color:var(--ac,var(--hA))}
.recall-a::before{content:'정답';font-size:10px;letter-spacing:.04em;color:var(--ink3);font-weight:800}
.recall-answer{display:inline-block;min-width:76px;padding:5px 9px;border-radius:9px;background:color-mix(in srgb,var(--ac,var(--hA)) 12%,var(--surface));
  color:transparent;position:relative;user-select:none;transition:.2s}
.recall-answer::after{content:'••••••';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink3);letter-spacing:.12em}
.recall-card.revealed .recall-answer{color:var(--ink);user-select:text}
.recall-card.revealed .recall-answer::after{content:''}
.recall-hint{display:block;margin-top:7px;font-size:11px;color:var(--ink3)}
.law-list{display:flex;flex-direction:column;gap:9px}
.law-article{border:1px solid var(--sep);border-radius:13px;background:var(--canvas);overflow:hidden}
.law-article summary{cursor:pointer;list-style:none;font-size:13px;font-weight:850;line-height:1.45;padding:12px 14px;color:var(--ink)}
.law-article summary::-webkit-details-marker{display:none}
.law-article summary::after{content:'원문 보기';float:right;font-size:10.5px;color:var(--ink3);font-weight:800}
.law-article[open] summary::after{content:'접기'}
.law-text{margin:0;padding:14px;border-top:1px solid var(--sep);font:12.5px/1.72 var(--font);white-space:pre-wrap;word-break:keep-all;color:var(--ink2);background:var(--surface)}
.burstwrap{position:fixed;inset:0;pointer-events:none;z-index:200}
.p{position:absolute;width:8px;height:8px;border-radius:2px;animation:burst .7s ease-out forwards}
</style>

 ＿＿＿＿ 기준","answer":"고의나 중대한 과실"},{"prompt":"이사회 회의에서 책임의 예외가 되려면 ＿＿＿＿를 표시해야 함","answer":"반대 의사"}]}}]},{"id":"E3","t":"이사장","c":[{"id":"c31","n":31,"t":"이사장의 직무권한","card":{"s":["대표권 — 금고 대표, 대외적 의사 표시","업무집행권 — 금고 업무 총괄, 직원 지휘·감독","총회 소집권 — 정기총회 및 임시총회 소집","이사회 소집권 — 이사회 소집 및 의장 역할"],"e":"이사장은 대외적으로는 금고의 얼굴이고, 대내적으로는 사령탑입니다. 계약서에 도장을 찍는 사람이자 회의를 여는 사람입니다. 다만 금고와 이사장이 다투는 상황에서는 감사가 금고를 대표합니다.","l":"새마을금고법 제19조제1항·제2항·제6항, 제12조제3항, 제17조제2항","one":"대표권 — 금고 대표, 대외적 의사 표시","lawKeys":["법_제19조","법_제12조","법_제17조"],"recall":[{"prompt":"대표권 — ＿＿＿＿, 대외적 의사 표시","answer":"금고 대표"},{"prompt":"업무집행권 — 금고 ＿＿＿＿, 직원 지휘·감독","answer":"업무 총괄"},{"prompt":"＿＿＿＿ — 정기총회 및 임시총회 소집","answer":"총회 소집권"},{"prompt":"＿＿＿＿ — 이사회 소집 및 의장 역할","answer":"이사회 소집권"}]}}]},{"id":"E4","t":"감사","c":[{"id":"c32","n":32,"t":"감사의 직무권한과 감사 범위","card":{"s":["금고의 재산과 업무집행상황을 분기마다 1회 이상 감사","감사 결과를 총회와 이사회에 보고","총회·이사회에 출석하여 의견 진술 가능","감사 결과 부정한 사실을 신속히 보고할 필요가 있으면 이사장에게 총회 소집 요구","이사장이 요구일부터 2주 이내 총회를 열지 않으면 감사가 5일 이내 소집하고 의장 직무 대행"],"e":"감사의 법정 핵심은 “재산과 업무집행상황의 정기 감사 및 보고”입니다. 총회 직접 소집은 언제나 자유롭게 행사하는 일반권한이 아니라 법 제14조의 요건과 순서를 충족한 경우에 작동합니다.","l":"새마을금고법 제19조제4항·제7항, 제14조제2항~제4항","hook":"감사: 분기 1회 + 재산·업무집행 + 총회·이사회 보고.","one":"금고의 재산과 업무집행상황을 분기마다 1회 이상 감사","lawKeys":["법_제19조","법_제14조"],"recall":[{"prompt":"금고의 재산과 업무집행상황을 ＿＿＿＿ 감사","answer":"분기마다 1회 이상"},{"prompt":"감사 결과를 ＿＿＿＿에 보고","answer":"총회와 이사회"},{"prompt":"이사장이 요구일부터 2주 이내 총회를 열지 않으면 감사가 ＿＿＿＿ 소집하고 의장 직무 대행","answer":"5일 이내"}]}}]}]}],"legalTexts":{"헌법_제75조":{"title":"대한민국헌법 제75조","text":"제75조\n대통령은 법률에서 구체적으로 범위를 정하여 위임받은 사항과 법률을 집행하기 위하여 필요한 사항에 관하여 대통령령을 발할 수 있다."},"헌법_제95조":{"title":"대한민국헌법 제95조","text":"제95조\n국무총리 또는 행정각부의 장은 소관사무에 관하여 법률이나 대통령령의 위임 또는 직권으로 총리령 또는 부령을 발할 수 있다."},"법_제1조":{"title":"새마을금고법 제1조(목적)","text":"제1조 목적\n이 법은 국민의 자주적인 협동 조직을 바탕으로 우리나라 고유의 상부상조 정신에 입각하여 자금의 조성과 이용, 회원의 경제적ㆍ사회적ㆍ문화적 지위의 향상, 지역사회 개발을 통한 건전한 국민정신의 함양과 국가경제 발전에 이바지함을 목적으로 한다."},"법_제2조":{"title":"새마을금고법 제2조(정의와 명칭)","text":"제2조(정의와 명칭)\n① 이 법에서 \"금고\"란 제1조의 목적을 달성하기 위하여 이 법에 따라 설립된 비영리법인인 새마을금고를 말한다.\n② 이 법에서 \"지역금고\"란 제1항의 금고 중 동일한 행정구역, 경제권 또는 생활권을 업무구역으로 하는 금고를 말한다.\n③ 이 법에서 \"중앙회\"란 모든 금고의 공동이익 증진과 지속적인 발전을 도모하기 위하여 이 법에 따라 설립한 비영리법인인 새마을금고중앙회를 말한다. \u003c개정 2011.3.8>\n④ 금고나 중앙회는 그 명칭 중 \"새마을금고\" 또는 \"새마을금고중앙회\"라는 문자를 사용하여야 한다. \u003c개정 2011.3.8>\n⑤ 금고나 중앙회가 아니면 제4항에 따른 명칭이나 이와 유사한 명칭을 사용할 수 없다. \u003c개정 2011.3.8>"},"법_제3조":{"title":"새마을금고법 제3조(국가 등의 협력의무)","text":"제3조(국가 등의 협력의무)\n① 국가나 지방자치단체는 금고나 중앙회가 행하는 사업의 육성을 위하여 필요한 지원을 하여야 하며, 국공유재산을 금고나 중앙회가 필요로 하는 경우에는 우선적으로 대여하거나 사용ㆍ수익하게 할 수 있다. \u003c개정 2011.3.8>\n② 국가나 지방자치단체는 금고의 원활한 발전을 위하여 예산의 범위에서 중앙회에 보조금을 내줄 수 있다. \u003c개정 2011.3.8>"},"법_제5조":{"title":"새마을금고법 제5조(정치 관여 금지)","text":"제5조 정치 관여 금지\n금고와 중앙회는 정치에 관여하는 일체의 행위를 할 수 없다. \u003c개정 2011.3.8>"},"법_제6조":{"title":"새마을금고법 제6조(다른 법률과의 관계)","text":"제6조(다른 법률과의 관계)\n① 제67조제1항제5호다목(내국환 업무만 해당된다)이나 같은 호 마목에 따른 중앙회의 신용사업 부문은 「은행법」 제2조에 따른 은행 및 「한국은행법」 제11조에 따른 하나의 금융기관으로 본다. \u003c개정 2010.5.17, 2011.3.8>\n② 금고와 중앙회의 사업에 관하여는 「보험업법」의 규정을 적용하지 아니한다. \u003c개정 2011.3.8>\n③ 금고와 중앙회는 「한국자산관리공사 설립 등에 관한 법률」 제45조의2를 적용할 경우에 같은 조의 적용을 받는 기관으로 본다. \u003c개정 2011.3.8, 2011.5.19, 2019.11.26>"},"법_제7조":{"title":"새마을금고법 제7조(설립)","text":"제7조(설립)\n① 금고는 50명 이상의 발기인이 중앙회장(이하 \"회장\"이라 한다)이 정하는 정관례에 따라 정관을 작성하여 창립총회의 의결을 거친 뒤에 회장을 거쳐 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장(구청장은 자치구의 구청장을 말한다. 이하 같다)의 인가를 받아 그 주된 사무소의 소재지에서 설립등기를 함으로써 성립한다. \u003c개정 2008.2.29, 2011.3.8, 2013.3.23, 2014.11.19, 2017.7.26, 2020.2.18>\n② 창립총회의 의사(議事)는 발기인에게 금고 설립 동의서를 개의(開議) 전까지 제출한 자 과반수의 출석과 출석자 3분의 2 이상의 찬성으로 의결한다.\n③ 창립총회의 공고ㆍ의결사항과 설립인가 신청 절차, 인가 제한 사유 등 금고 설립에 필요한 사항은 대통령령으로 정한다.\n④ 삭제 \u003c2011.3.8>\n⑤ 삭제 \u003c2011.3.8>"},"법_제8조":{"title":"새마을금고법 제8조(정관의 기재사항)","text":"제8조 정관의 기재사항\n금고의 정관에는 다음 각 호의 사항을 적어야 한다. \u003c개정 2023.4.11>\n\n1. 목적\n2. 명칭\n3. 주된 사무소의 소재지\n4. 해당 금고의 업무구역\n5. 회원의 자격과 가입, 탈퇴 및 제명(除名)에 관한 사항\n6. 출자(出資) 1좌(座)의 금액과 납입 방법\n7. 기관에 관한 사항 및 임원의 수와 선출에 관한 사항\n8. 사업의 종류와 회계에 관한 사항\n9. 공고 방법\n10. 해산에 관한 사항\n11. 그 밖에 필요한 사항"},"법_제9조":{"title":"새마을금고법 제9조(회원과 자본금)","text":"제9조(회원과 자본금)\n① 금고의 회원은 그 금고의 정관으로 정하는 업무구역에 주소나 거소(居所)가 있는 자 또는 생업에 종사하는 자로서 출자 1좌 이상을 현금으로 납입한 자로 한다.\n② 한 금고의 회원 수는 100명 이상으로 한다.\n③ 금고는 정당한 사유 없이 회원이 될 수 있는 자격을 가진 자의 가입을 거절할 수 없으며, 가입에 관하여 필요한 사항은 정관으로 정한다.\n④ 출자 1좌의 금액은 정관으로 정하며, 한 회원이 가질 수 있는 출자좌수(出資座數)의 최고한도는 총출자좌수의 100분의 15를 초과할 수 없다.\n⑤ 회원은 출자좌수에 관계없이 평등한 의결권과 선거권을 가진다. 다만, 다음 각 호의 어느 하나에 해당하는 회원에 대하여는 정관으로 정하는 바에 따라 의결권과 선거권을 제한할 수 있다. \u003c개정 2025.1.7>\n1. 미성년인 회원\n2. 해당 금고의 회원 자격을 유지한 기간이 6개월 미만인 회원\n3. 출자액이 행정안전부장관(이하 \"주무부장관\"이라 한다)이 정하여 고시하는 금액 미만인 회원\n⑥ 회원은 다른 회원을 대리인으로 하여 의결권을 행사할 수 있다. 이 경우 한 회원이 대리할 수 있는 회원의 수는 두 명을 초과할 수 없다.\n⑦ 회원이 금고에 납입할 출자금은 금고에 대한 채권과 상계(相計)하지 못한다.\n⑧ 출자금은 질권(質權)의 목적이 될 수 없다.\n⑨ 회원은 이사장의 승인을 받아 그의 출자금을 다른 회원에게 양도할 수 있다. 이 경우 양수인은 양도인의 출자금에 관한 재산상의 권리와 의무를 승계한다.\n⑩ 회원의 책임은 그 출자액을 한도로 한다. \u003c개정 2023.4.11>\n⑪ 금고의 자본금은 회원이 납입한 출자금(제9조의2에 따른 출자금을 포함한다), 제9조의3에 따른 회전출자금 및 제9조의4에 따른 우선출자금(누적되지 아니하는 것만 해당한다)의 총액으로 한다. \u003c개정 2023.4.11>"},"법_제10조":{"title":"새마을금고법 제10조(탈퇴 등)","text":"제10조(탈퇴 등)\n① 회원은 언제라도 정관으로 정하는 바에 따라 금고에서 탈퇴할 수 있다.\n② 회원이 다음 각 호의 어느 하나에 해당하는 경우에는 당연히 금고에서 탈퇴한 것으로 본다. \u003c개정 2016.1.6>\n1. 사망한 경우(법인은 해산한 경우)\n2. 파산선고를 받은 경우\n3. 피성년후견인이 된 경우\n4. 회원의 자격을 잃은 경우\n③ 제2항제4호의 자격상실에 관한 사항은 정관으로 정한다.\n④ 제1항에 따라 탈퇴한 회원(제2항에 따라 탈퇴한 것으로 보는 경우와 제10조의2에 따라 제명된 경우를 포함한다. 이하 이 조에서 같다)은 정관으로 정하는 바에 따라 그의 예탁금 및 적금의 환급(還給)을 청구할 수 있다. \u003c개정 2016.1.6>\n⑤ 제1항에 따라 탈퇴한 회원은 탈퇴 당시 회계연도 다음 회계연도부터 정관으로 정하는 바에 따라 출자금의 환급을 청구할 수 있다. \u003c신설 2016.1.6>\n⑥ 금고는 금고의 재산으로 그 채무를 다 갚을 수 없는 경우에는 제5항에 따른 출자금을 환급할 때 정관으로 정하는 바에 따라 탈퇴하거나 제명된 회원이 부담하여야 할 손실액을 빼고 환급할 수 있다. \u003c신설 2016.1.6>\n⑦ 제4항 및 제5항에 따른 환급청구권은 환급을 청구할 수 있는 날부터 출자금은 2년 간, 예탁금ㆍ적금은 5년 간 행사하지 아니하면 시효의 완성으로 소멸한다. \u003c신설 2016.1.6>"},"법_제10조의2":{"title":"새마을금고법 제10조의2(제명)","text":"제10조의2(제명)\n① 회원이 다음 각 호의 어느 하나에 해당하는 경우에는 총회의 의결로 제명할 수 있다.\n1. 1년 이상의 장기간에 걸쳐 대출금 상환을 지체한 경우\n2. 금고의 사업집행을 고의로 방해한 사실이 입증된 경우\n3. 2년 이상 계속하여 금고의 사업을 이용하지 아니한 경우\n4. 고의 또는 중대한 과실로 금고에 직접적인 재산상의 손해를 끼친 경우\n② 금고는 제1항에 따라 회원을 제명하려면 총회 개최일 10일 전까지 그 회원에게 제명의 사유를 알리고 총회에서 의견을 진술할 기회를 주어야 한다.\n③ 제1항에 따라 제명된 자에 대하여 해당 금고는 제명된 날부터 2년 간 회원가입을 제한할 수 있다."},"법_제12조":{"title":"새마을금고법 제12조(총회)","text":"제12조(총회)\n① 금고에 총회를 둔다.\n② 총회는 정기총회와 임시총회로 하며, 정기총회는 매년 1회 정관으로 정하는 바에 따라 소집하고, 임시총회는 필요하다고 인정할 때에 소집한다.\n③ 총회는 회원으로 구성하며 이사장이 소집한다.\n④ 다음 각 호의 사항은 총회의 의결이 있어야 한다. \u003c개정 2017.12.26>\n1. 정관의 변경\n2. 해산, 합병 또는 휴업\n3. 임원의 선임(이사장의 선임은 정관으로 이사장을 총회에서 선출하도록 한 경우로 한정한다)과 해임\n4. 기본 재산의 처분\n5. 결산보고서(사업보고서ㆍ재무상태표ㆍ손익계산서와 잉여금처분안 또는 손실금처리안을 포함한다)의 승인\n6. 사업계획, 예산의 결정\n7. 경비의 부과와 징수 방법\n8. 그 밖의 중요한 사항\n⑤ 제4항제1호의 사항은 회장을 거쳐 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장의 인가를 받지 아니하면 그 효력을 발생하지 아니한다. \u003c개정 2011.3.8, 2020.2.18>\n⑥ 금고는 대통령령으로 정하는 바에 따라 총회 의사록을 작성하여야 한다."},"법_제13조":{"title":"새마을금고법 제13조(총회의 개의와 의결)","text":"제13조(총회의 개의와 의결)\n① 총회는 이 법에 다른 규정이 있는 경우 외에는 재적회원(在籍會員) 과반수의 출석으로 개의(開議)하고 출석회원 과반수의 찬성으로 의결한다. 다만, 재적회원이 500명을 초과하는 경우에는 251명 이상 출석으로 개의하고 출석회원 과반수의 찬성으로 의결할 수 있다. \u003c개정 2025.1.7>\n② 제12조제4항제1호 및 제2호의 사항은 재적회원 과반수(제1항 단서의 경우에는 251명 이상의 회원)의 출석과 출석회원 3분의 2 이상의 찬성으로 의결하여야 한다. \u003c개정 2025.1.7>\n③ 총회에서는 제15조제2항에 따라 공고한 사항에 대하여만 의결할 수 있다. 다만, 긴급한 사항으로서 재적회원 과반수(제1항 단서의 경우에는 251명 이상의 회원)의 출석과 출석회원 3분의 2 이상의 찬성이 있는 경우에는 그러하지 아니하다. \u003c개정 2025.1.7>\n④ 금고와 특정회원과의 관련 사항을 의결하는 경우에는 그 회원은 의결권이 없다."},"법_제14조":{"title":"새마을금고법 제14조(총회의 소집 요구)","text":"제14조(총회의 소집 요구)\n① 회원은 회원 3분의 1 이상의 동의를 받아 회의의 목적과 이유를 적고 서명날인한 서면을 제출하여 임시총회의 소집을 이사장에게 요구할 수 있다.\n② 감사는 제19조제4항에 따른 감사를 실시한 결과 금고의 재산 상황 또는 업무집행에 부정한 사실이 발견되어 그 내용을 총회에 신속히 보고할 필요가 있을 때에는 회의의 목적과 소집 이유를 적은 서면을 제출하여 총회의 소집을 이사장에게 요구할 수 있다. \u003c신설 2017.12.26>\n③ 제1항, 제2항 또는 제7항의 요구가 있으면 이사장은 요구가 있는 날부터 2주일 이내에 총회를 개최하여야 한다. \u003c개정 2017.12.26, 2025.1.7>\n④ 총회를 소집할 자가 없거나 제3항의 기간에 정당한 사유 없이 이사장이 총회를 개최하지 아니하면 감사가 5일 이내에 총회를 소집하여야 하며, 이 경우 감사가 의장의 직무를 대행한다. \u003c개정 2017.12.26>\n⑤ 감사가 제4항의 기간에 총회를 소집하지 아니하면 제1항에 따라 총회 소집을 요구한 회원의 대표가 총회를 개최하며, 이 경우 그 회원의 대표가 의장의 직무를 대행한다. \u003c개정 2017.12.26>\n⑥ 제4항이나 제5항에 따라 감사나 회원대표가 총회를 소집할 때에는 소집 공고 전에 회장에게 알려야 한다. \u003c개정 2011.3.8, 2017.12.26>\n⑦ 회장은 제79조제1항에 따른 지도ㆍ감독을 위하여 필요한 경우 임시총회의 소집을 이사장에게 요구할 수 있다. \u003c신설 2025.1.7>\n⑧ 이사장은 회장의 요구가 있는 경우 제7항에 따른 임시총회 개최 시 회장이 지정하는 사람이 임시총회에 출석하여 회원들에게 지도ㆍ감독을 위한 중요 사항을 설명할 수 있도록 하여야 한다. \u003c신설 2025.1.7>"},"법_제15조":{"title":"새마을금고법 제15조(회원에 대한 통지 등)","text":"제15조(회원에 대한 통지 등)\n① 금고는 그 회원에게 다음 각 호의 방법으로 통지를 할 수 있다. \u003c개정 2025.1.7>\n1. 회원 명부에 적은 회원의 주소 또는 거소로 우편물, 문서 발송\n2. 회원 명부에 적은 회원의 전자우편 등 전자적 수단 및 그 밖에 정보통신망을 이용한 방법\n② 총회의 소집 통지는 총회 개최일 7일 전에 개회 일시, 개회 장소, 회의 목적사항을 제시하여 정관으로 정한 방법에 따라 공고하여야 한다."},"법_제16조":{"title":"새마을금고법 제16조(대의원회)","text":"제16조(대의원회)\n① 회원이 500명을 초과하는 금고는 대통령령으로 정하는 바에 따라 총회를 갈음할 대의원회를 둘 수 있다. \u003c개정 2025.1.7>\n② 대의원의 임기는 3년으로 한다. \u003c개정 2023.4.11>\n③ 제2항에도 불구하고 대의원 중 일부의 궐원으로 인한 재선거 또는 보궐선거로 선임된 대의원의 임기는 다음 각 호와 같다. \u003c신설 2023.4.11>\n1. 재선거의 경우에는 재선거 실시 전에 실시한 선거로 선출된 대의원의 남은 임기\n2. 보궐선거의 경우에는 전임자의 남은 임기\n④ 대의원의 자격, 정수, 선임 방법 등에 필요한 사항은 대통령령으로 정한다. \u003c개정 2023.4.11>\n⑤ 대의원은 다음 각 호의 직을 겸할 수 없다. \u003c개정 2017.12.26, 2023.4.11>\n1. 해당 금고의 임직원(이사장은 제외한다)\n2. 다른 금고의 대의원\n3. 다른 금고의 임직원\n⑥ 대의원회에 관하여는 총회에 관한 규정을 준용한다. \u003c개정 2023.4.11>"},"법_제17조":{"title":"새마을금고법 제17조(이사회)","text":"제17조(이사회)\n① 금고에 이사회를 둔다.\n② 이사회는 이사장을 포함한 이사로 구성하며, 이사장이 이를 소집한다. \u003c개정 2021.10.19>\n③ 이사장은 재적이사 3분의 1 이상의 요구가 있는 경우에는 지체 없이 이사회를 소집하여야 한다. 이 경우 이사장이 정당한 이유 없이 소집 요구를 받은 날부터 2주일 이내에 이사회를 소집하지 아니하는 경우에는 그 소집을 요구한 이사의 대표가 이사회를 소집하고, 의장의 직무를 대행한다. \u003c신설 2025.1.7>\n④ 이사는 이사장에게 서면으로 일정한 사항을 이사회의 회의에 부칠 것을 제안할 수 있다. 이 경우 이사장은 그 제안사항을 이사회에 보고하여야 하고, 이사회는 그 내용이 법령 또는 정관을 위반하는 경우를 제외하고는 이를 이사회의 회의에 부쳐야 한다. \u003c신설 2025.1.7>\n⑤ 다음 각 호의 사항은 이사회의 의결이 있어야 한다. \u003c개정 2011.3.8, 2025.1.7>\n1. 규정의 제정, 변경 또는 폐지\n2. 사업 집행에 대한 기본 방침의 결정\n3. 소요 자금의 차입. 다만, 중앙회에서 차입할 경우는 최고한도\n4. 정관으로 정하는 간부 직원의 임면(任免)과 직원의 징계\n5. 상근이사에 대한 성과평가의 실시에 관한 사항\n6. 총회로부터 위임된 사항과 총회에 부칠 사항\n7. 그 밖에 이사장이 회의에 부치는 사항\n⑥ 이사장은 다음 각 호의 사항을 이사회에 보고하여야 한다. \u003c개정 2017.12.26, 2025.1.7>\n1. 제19조의2에 따른 상근이사에 대한 성과평가 결과\n2. 제76조에 따른 감사 결과\n3. 제79조제6항에 따른 경영 평가 결과\n4. 제74조제3항, 제79조제3항 및 제81조제1항에 따른 검사 결과\n⑦ 이사회는 재적이사 과반수의 출석으로 개의하고 출석이사 과반수의 찬성으로 의결한다. \u003c개정 2025.1.7>\n⑧ 이사회의 소집 방법, 의사록 작성 등은 정관으로 정하는 바에 따른다. \u003c개정 2025.1.7>"},"법_제18조":{"title":"새마을금고법 제18조(임원의 선임 등)","text":"제18조(임원의 선임 등)\n① 금고의 임원으로 이사장 1명을 포함한 7명 이상 15명 이하의 이사와 3명 이하의 감사를 두며, 임원은 금고의 다른 직(職)을 겸할 수 없다. \u003c개정 2021.10.19>\n② 금고의 자산 규모, 재무구조 등을 고려하여 대통령령으로 정하는 금고의 경우에는 정관으로 정하는 바에 따라 임원 중 1명 이상을 상근으로 할 수 있되, 상근하는 임원의 수는 이사장을 포함한 이사 중 2명, 감사 중 1명을 초과할 수 없다. 이 경우 상근하는 임원은 금고 업무에 대한 전문지식과 경험이 풍부한 사람으로서 대통령령으로 정하는 요건을 갖춘 사람 중에서 제4항부터 제9항까지에 따라 선임하거나 선출하여야 한다. \u003c개정 2011.3.8, 2023.4.11>\n③ 제2항을 적용할 때 이사장이 상근하지 아니하는 지역금고의 경우에는 제4항에 따라 선임된 상근이사를 두어야 하고, 자산 규모 등이 대통령령으로 정하는 기준 이상에 해당하는 지역금고는 상근감사를 두어야 한다. \u003c개정 2025.1.7>\n④ 제2항에 따라 상근하는 임원 중 이사장이 아닌 이사는 이사회의 추천을 받아 총회에서 선임한다. \u003c개정 2023.4.11>\n⑤ 이사장은 회원 중에서 회원의 무기명 비밀투표로 직접 선출한다. 다만, 자산이 일정 규모 이하인 금고 등 대통령령으로 정하는 금고의 이사장은 회원의 투표로 직접 선출하는 방법, 총회에서 선출하는 방법 또는 대의원회에서 선출하는 방법 중 정관으로 정하는 방법을 택하여 선출할 수 있다. \u003c개정 2021.10.19>\n⑥ 제5항에 따라 회원의 투표로 직접 선출하는 경우 투표의 방법ㆍ절차, 투표의 사전 통지 등에 필요한 사항은 정관으로 정한다. \u003c신설 2021.10.19>\n⑦ 제5항에도 불구하고 이사장의 후보자가 1명인 경우에는 정관으로 따로 정하는 방법에 따라 이사장을 선출할 수 있다. \u003c신설 2021.10.19>\n⑧ 이사장의 선출 방법에 따른 당선인의 결정은 다음 각 호에 따른다. \u003c개정 2017.12.26, 2021.10.19, 2025.1.7>\n1. 회원의 투표로 직접 선출하거나 총회에서 선출하는 경우에는 최다득표자를 당선인으로 결정한다. 다만, 최다득표자가 2명 이상인 때에는 연장자를 당선인으로 결정한다.\n2. 대의원회에서 선출하는 경우에는 과반수득표자를 당선인으로 결정한다. 다만, 과반수득표자가 없는 경우에는 1위와 2위의 다수득표자만을 후보자로 하여 다시 투표를 실시하여 최다득표자를 당선인으로 결정하되, 최다득표자가 2명 이상인 때에는 연장자를 당선인으로 결정한다.\n⑨ 이사장을 제외한 임원은 총회에서 무기명 비밀투표로 선출하되, 다수득표자 순으로 임원의 정수에 해당하는 사람으로 한다. 다만, 이사장을 제외한 임원의 후보자가 각각 그 정수 이내일 경우에는 정관으로 따로 정하는 방법에 따라 선출할 수 있다. \u003c신설 2017.12.26, 2021.10.19, 2025.1.7>\n⑩ 금고의 임원은 명예직으로 한다. 다만, 제2항에 따라 상근하는 임원에게는 급여를 지급할 수 있다. \u003c개정 2017.12.26, 2021.10.19>\n⑪ 임원의 선임 방법과 절차 등에 관하여 이 법에서 정한 사항 외에 필요한 사항은 정관으로 정한다. \u003c개정 2017.12.26, 2021.10.19>"},"법_제19조":{"title":"새마을금고법 제19조(임원과 직원)","text":"제19조(임원과 직원)\n① 이사장은 금고를 대표하고, 금고의 업무를 총괄한다.\n② 이사장은 총회와 이사회의 의장이 된다.\n③ 이사장의 자리가 비거나 사고가 있으면 이사회가 정하는 이사가 그 직무를 대행한다. 다만, 이사장이 구속되거나 60일 이상의 장기입원 등의 사유로 금고의 업무를 집행할 수 없고 총회를 소집할 여유가 없을 때에는 회장은 임원 중에서 임시대표이사를 지정할 수 있다. \u003c개정 2011.3.8, 2021.10.19>\n④ 감사는 금고의 재산과 업무 집행상황에 대하여 분기마다 1회 이상 감사하고 그 결과를 총회와 이사회에 보고하여야 한다.\n⑤ 감사의 직무에 관하여는 「상법」 제402조, 제412조의5, 제413조 및 제413조의2를 준용한다. \u003c개정 2016.1.6, 2017.12.26>\n⑥ 금고와 이사장 사이에 소송, 계약 등의 법률행위를 하는 경우에는 감사가 금고를 대표한다.\n⑦ 감사는 총회나 이사회에 출석하여 그 의견을 진술할 수 있다.\n⑧ 임원은 총회의 의결로써 해임하며, 그 절차나 그 밖에 필요한 사항은 대통령령으로 정한다.\n⑨ 금고의 직원으로서 전무, 상무 및 그 밖의 직원을 둘 수 있으며, 전무나 상무를 둘 수 있는 금고와 직원의 자격 등 필요한 사항은 대통령령으로 정한다."},"법_제20조":{"title":"새마을금고법 제20조(임원의 임기)","text":"제20조(임원의 임기)\n① 이사장 및 이사의 임기는 4년으로 하고, 감사의 임기는 3년으로 한다. \u003c개정 2011.3.8, 2023.4.11>\n② 제1항에도 불구하고 임원 중 일부의 궐원으로 인한 재선거 또는 보궐선거로 선임된 임원의 임기는 다음 각 호와 같다. \u003c개정 2023.4.11>\n1. 재선거의 경우에는 재선거 실시 전에 실시한 선거로 선출된 임원의 남은 임기\n2. 보궐선거의 경우에는 전임자의 남은 임기\n③ 이사장은 2차에 한정하여 연임할 수 있다. 이 경우 이사장이 임기만료일 전 2년부터 임기만료일까지 퇴임한 경우에는 1회를 재임한 것으로 보고, 임기만료에 따라 퇴임한 이사장이 임기만료 후 2년 이내에 이사장으로 선임되는 경우에는 연임한 것으로 본다. \u003c신설 2023.4.11>"},"법_제21조":{"title":"새마을금고법 제21조(임원의 결격 사유)","text":"제21조(임원의 결격 사유)\n① 다음 각 호의 어느 하나에 해당하는 사람은 금고의 임원이 될 수 없다. 다만, 제18조제3항에 따른 상근이사는 제16호를 적용하지 아니한다. \u003c개정 2011.3.8, 2016.1.6, 2017.12.26, 2023.4.11>\n1. 미성년자ㆍ피성년후견인 또는 피한정후견인\n2. 파산선고를 받고 복권되지 아니한 사람\n3. 제85조제1항, 「형법」 제355조부터 제357조까지의 죄(금고나 중앙회의 사업과 관련된 죄만 해당한다)를 범하여 금고 이상의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다. 이하 이 항에서 같다) 집행이 면제된 날부터 5년이 지나지 아니한 사람\n4. 제3호의 죄를 범하여 금고 이상의 형의 집행유예를 선고받고 그 집행유예 기간이 끝난 날부터 3년이 지나지 아니한 사람\n5. 제3호의 죄를 범하여 금고 이상의 형의 선고유예를 받고 그 선고유예 기간이 끝난 날부터 3년이 지나지 아니한 사람\n6. 제3호의 죄를 범하여 벌금형을 선고받고 그 형이 확정된 후 3년이 지나지 아니한 사람\n7. 삭제\u003c2023.4.11>\n8. 제85조제3항 또는 「공공단체등 위탁선거에 관한 법률」 제58조, 제59조, 제61조부터 제66조까지에 규정된 죄를 범하여 100만원 이상의 벌금형을 선고받고 그 형이 확정된 후 3년이 지나지 아니한 사람\n9. 제3호의 죄 외의 죄로 금고 이상의 실형을 선고받고 그 집행이 끝나거나 집행이 면제된 날부터 3년이 지나지 아니한 사람\n10. 제3호의 죄 외의 죄로 금고 이상의 형의 집행유예를 선고받고 그 집행유예 기간 중에 있는 사람\n11. 제3호의 죄 외의 죄로 금고 이상의 형의 선고유예를 받고 그 선고유예 기간 중에 있는 사람\n11의2. 금고의 임직원으로 재임 또는 재직 중 다른 임직원에게 「형법」 제257조제1항, 제260조제1항, 제261조(제260조제2항의 죄를 범한 경우는 제외한다), 제262조(제260조제2항의 죄를 범한 경우는 제외하며, 제257조의 예에 따르는 경우로 한정한다) 또는 제324조의 죄를 범하여 300만원 이상의 벌금형을 선고받고 그 형이 확정된 후 3년이 지나지 아니한 사람\n11의3. 금고의 임직원으로 재임 또는 재직 중 다른 임직원에게 「형법」 제303조제1항 또는 「성폭력범죄의 처벌 등에 관한 특례법」 제10조제1항의 죄를 범하여 100만원 이상의 벌금형을 선고받고 그 형이 확정된 후 3년이 지나지 아니한 사람\n12. 이 법 또는 대통령령으로 정하는 금융 관련 법령(이하 \"금융관계법령\"이라 한다)에 따라 징계면직 또는 해임된 사람으로서 징계면직 또는 해임된 날부터 5년이 지나지 아니한 사람\n12의2. 이 법 또는 금융관계법령에 따라 직무정지(업무의 집행정지를 포함한다. 이하 이 항에서 같다) 또는 정직의 제재조치를 받은 사람으로서 제재조치 종료일부터 4년이 지나지 아니한 사람\n13. 이 법 또는 금융관계법령에 따라 재직 또는 재임 중이었더라면 징계면직 또는 해임요구의 조치를 받았을 것으로 통보된 퇴임 직원이나 임원으로서 그 통보가 있은 날부터 5년(통보가 있은 날부터 5년이 퇴직 또는 퇴임한 날부터 7년을 초과하는 경우에는 퇴직 또는 퇴임한 날부터 7년으로 한다)이 지나지 아니한 사람\n13의2. 이 법 또는 금융관계법령에 따라 재임 또는 재직 중이었더라면 직무정지 또는 정직의 제재조치를 받았을 것으로 통보된 퇴임 임원이나 퇴직한 직원으로서 그 통보가 있은 날부터 4년(통보가 있은 날부터 4년이 퇴임 또는 퇴직한 날부터 6년을 초과하는 경우에는 퇴임 또는 퇴직한 날부터 6년으로 한다)이 지나지 아니한 사람\n14. 법원의 판결이나 다른 법률에 따라 자격을 잃거나 정지된 사람\n15. 공공기관 또는 다른 법인이나 회사에서 징계면직된 사람으로서 징계면직된 날부터 2년이 지나지 아니한 사람\n16. 회원으로서 임원 선임 선거일공고일 현재의 정관으로 정하는 출자좌수 이상을 2년 이상 계속 보유하고 있지 아니한 사람. 다만, 설립이나 합병 후 2년이 지나지 아니한 금고의 경우에는 그러하지 아니하다.\n17. 임원 선임 선거일공고일 현재 해당 금고에 대하여 정관으로 정하는 금액이나 기간을 초과하는 채무를 연체한 사람\n18. 그 밖에 정관으로 정하는 자격 제한 사유에 해당하는 사람\n② 임원에게 제1항(제12호의2는 제외한다)에 따른 사유가 발견되거나 발생한 경우에는 해당 임원은 당연 퇴임된다. \u003c개정 2016.1.6>\n③ 제2항에 따라 퇴임한 임원이 퇴임 전에 관여한 행위는 그 효력을 잃지 아니한다.\n④ 금고와 중앙회는 임원 또는 임원 후보자에게 제1항의 결격사유가 있는지를 확인하기 위하여 주된 사무소를 관할하는 경찰관서의 장에게 제1항제3호부터 제6호까지 및 제8호부터 제11호까지, 제11호의2 및 제11호의3에 해당하는 범죄의 경력조회 등 필요한 협조를 요청할 수 있고, 해당 경찰관서의 장은 그 결과를 회보하여야 한다. \u003c신설 2011.3.8, 2023.4.11>"},"법_제25조":{"title":"새마을금고법 제25조(임원의 성실 의무와 책임)","text":"제25조(임원의 성실 의무와 책임)\n① 금고의 임원은 이 법과 이 법에 따라 하는 명령과 정관ㆍ규정 및 총회와 이사회의 의결 사항을 지키고 금고를 위하여 성실히 그 직무를 수행하여야 한다.\n② 임원이 그 직무를 수행할 때 고의나 과실(비상근임원의 경우에는 고의나 중대한 과실)로 금고에 끼친 손해에 대하여는 연대하여 손해배상의 책임을 진다.\n③ 임원이 그 직무를 수행할 때 고의나 중대한 과실로 타인에게 끼친 손해에 대하여는 연대하여 손해배상의 책임을 진다.\n④ 임원이 결산보고서에 거짓으로 기록, 등기 또는 공고를 하여 금고나 타인에게 손해를 끼친 경우에도 제2항 및 제3항과 같다.\n⑤ 이사회가 고의나 중대한 과실로 금고에 손해를 끼친 경우에는 그 고의나 중대한 과실에 관련된 이사회에 출석한 임원은 그 손해에 대하여 연대하여 손해배상의 책임을 진다. 다만, 그 회의에서 반대 의사를 표시한 임원은 그러하지 아니하다.\n⑥ 제2항부터 제5항까지의 규정에 따른 구상권(求償權)은 이사장을 포함한 이사에 대하여는 감사가, 임원 전원에 대하여는 회원 3분의 1 이상의 동의를 받은 회원 대표가 행사한다. \u003c개정 2021.10.19>\n⑦ 정관으로 정하는 임원은 그 직무에 관하여 신원보증을 하여야 한다.\n⑧ 제18조제2항에 따라 상근하는 임원은 다른 법인이나 회사의 상근직을 겸할 수 없다. \u003c신설 2011.3.8>"},"법_제26조":{"title":"새마을금고법 제26조(「민법」ㆍ「상법」의 준용)","text":"제26조(「민법」ㆍ「상법」의 준용)\n① 금고의 임원에 관하여는 「민법」 제35조, 제63조 및 「상법」 제382조제2항, 제385조제2항ㆍ제3항, 제386조제1항, 제403조부터 제406조까지, 제407조 및 제408조를 각각 준용한다. 이 경우 「상법」 제385조제2항 중 \"발행주식의 총수의 100분의 3 이상에 해당하는 주식을 가진 주주\"는 \"회원 100명 또는 100분의 3 이상의 동의를 받은 회원\"으로 보고, 같은 법 제403조제1항 중 \"발행주식의 총수의 100분의 1 이상에 해당하는 주식을 가진 주주\"는 \"회원 100명 또는 100분의 1 이상의 동의를 받은 회원\"으로 본다. \u003c개정 2025.1.7>\n② 상근이사 또는 정관으로 정하는 간부직원에 관하여는 「상법」 제11조제1항ㆍ제3항, 제12조, 제13조 및 제17조와 「상업등기법」 제23조제1항, 제50조 및 제51조를 각각 준용한다. \u003c개정 2011.3.8, 2014.5.20>"},"법_제35조":{"title":"새마을금고법 제35조(적립금과 손익금의 처리)","text":"제35조(적립금과 손익금의 처리)\n① 금고는 매 사업연도마다 자기자본(직전 사업연도말 재무상태표의 자산총액에서 부채총액을 차감한 금액을 말한다. 이하 같다)의 총액에 달할 때까지 잉여금의 100분의 15 이상을 법정 적립금으로 적립하여야 한다. \u003c개정 2011.3.8, 2025.1.7>\n② 금고는 대손금(貸損金)의 상각(償却)이나 해산의 경우 외에는 제1항에 따른 적립금을 사용하거나 배당에 충당하지 못한다.\n③ 금고는 결손의 보전(補塡)과 불가항력에 의한 회계사고에 충당하기 위한 준비금으로서 매 사업연도마다 잉여금의 100분의 20 이상을 특별적립금으로 적립하여야 한다. \u003c개정 2025.1.7>\n④ 금고는 정관으로 정하는 바에 따라 사업이나 배당준비금으로서 매 사업연도마다 잉여금의 일부를 임의적립금으로 적립할 수 있다. \u003c개정 2025.1.7>\n⑤ 금고는 사업연도 결산 결과 손실이 발생한 경우에는 특별적립금, 임의적립금의 순으로 이를 보전하되, 잔여손실금이 있으면 이를 다음 사업연도에 이월한다.\n⑥ 금고가 여러 사업연도에 걸쳐 계속하여 손실이 있고 이를 보전할 적립금이 없는 경우에는 총회에서 회원 과반수(제13조제1항 단서의 경우에는 251명 이상의 회원)의 출석과 출석한 회원 3분의 2 이상의 찬성을 받아 자본금을 감소하여 각 회원의 납입출자액이 감소한 것으로 할 수 있다. 자본금을 감소한 경우에는 이를 회장에게 보고하여야 한다. \u003c개정 2011.3.8, 2025.1.7>\n⑦ 제6항에 따라 자본금을 감소한 경우에는 이의신고 기간을 정하여 공고하여야 하며, 공고된 이의신고 기간에 채권자로부터 자본금 감소에 대한 이의신고가 없는 경우에는 이의가 없는 것으로 본다.\n⑧ 채권자가 이의신고를 한 경우에는 금고가 이를 변제하거나 상당한 담보를 제공하지 아니하면 제6항에 따른 자본금의 감소는 그 효력을 발생하지 아니한다.\n⑨ 제6항 및 제7항에 따른 보고와 공고 등에 관하여 필요한 사항은 대통령령으로 정한다.\n⑩ 금고는 손실금을 보전하고 적립금을 공제한 후가 아니면 잉여금을 배당할 수 없으며, 배당은 정관으로 정하는 비율의 한도 내에서 납입출자액에 비례하여야 한다. 이 경우 회원의 사업 이용 실적의 비율에 따른 배당을 병행할 수 있다. \u003c개정 2025.1.7>"},"법_제44조":{"title":"새마을금고법 제44조(「민법」 등 준용)","text":"제44조 「민법」 등 준용\n금고의 해산과 청산에 관하여는 이 법에 규정한 것 외에는 「민법」 제79조, 제81조, 제87조, 제88조제1항 및 제2항, 제89조부터 제92조까지, 제93조제1항과 제2항 및 「비송사건절차법」 제121조를 각각 준용한다."},"법_제45조":{"title":"새마을금고법 제45조(설립등기)","text":"제45조(설립등기)\n① 제7조제1항에 따라 설립인가를 받은 경우에는 그 설립인가서가 도달한 날부터 3주간 내에 다음 각 호의 사항을 등기하여야 한다.\n1. 목적\n2. 명칭\n3. 업무구역\n4. 사무소의 소재지\n5. 설립인가 연월일\n6. 출자 1좌의 금액\n7. 존립 시기나 해산 사유를 정할 때에는 그 시기나 사유\n8. 임원의 성명과 주소\n9. 공고 방법\n② 제1항에 따른 등기를 신청할 때에는 설립인가서, 창립총회 의사록 및 정관의 등본을 첨부하여야 한다."},"법_제81조":{"title":"새마을금고법 제81조(회원의 검사 청구)","text":"제81조(회원의 검사 청구)\n① 회원이 재적회원(在籍會員) 10분의 1 이상의 동의를 받아 소속 금고의 업무 또는 회계의 집행상황이 법령, 정관 또는 공제규정에 위배된다는 이유로 검사를 청구한 경우에는 주무부장관은 회장에게 해당 금고의 업무상황을 검사하게 할 수 있다.\n② 회원이 재적회원 10분의 1 이상의 동의를 받아 중앙회의 업무나 회계의 집행상황이 법령, 정관 또는 공제규정에 위배된다는 이유로 검사를 청구한 경우에는 주무부장관은 금융감독원장에게 중앙회를 검사하게 할 수 있다. \u003c개정 2011.3.8>"},"법_제85조":{"title":"새마을금고법 제85조(벌칙)","text":"제85조(벌칙)\n① 다음 각 호의 어느 하나에 해당하는 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. \u003c개정 2011.3.8, 2014.6.11, 2025.1.7>\n1. 자금을 금고나 중앙회의 사업 목적 외에 사용ㆍ대출하거나 금고나 중앙회의 재산을 투기 목적으로 처분하거나 이용한 금고 또는 중앙회의 임직원\n2. 제80조제1항에 따른 경영지도 사항을 이행하지 아니한 금고 또는 중앙회의 임직원\n3. 제80조의2제3항에 따른 경영개선명령이나 이행계획제출명령을 이행하지 아니한 임원, 관리인 또는 청산인\n② 금고나 중앙회의 임직원 또는 청산인이 다음 각 호의 어느 하나에 해당하는 행위를 한 경우에는 3년 이하의 징역이나 3천만원 이하의 벌금에 처한다. \u003c개정 2011.3.8, 2014.6.11, 2017.12.26, 2023.4.11>\n1. 감독기관의 인가나 승인을 받아야 하는 사항에 관하여 인가나 승인을 받지 아니하거나 인가가 취소된 후에도 업무를 계속하여 수행한 경우\n2. 거짓으로 등기를 한 경우\n3. 감독기관, 총회, 이사회에 대하여 거짓으로 자료를 제출하거나 진술(서면진술을 포함한다)한 경우\n4. 총회나 이사회의 의결이 필요한 사항에 대하여 의결을 거치지 아니하고 집행한 경우\n5. 제29조(제67조제5항에서 준용하는 경우를 포함한다)를 위반한 경우\n6. 금고나 중앙회로 하여금 제28조제3항(제67조제5항에서 준용하는 경우를 포함한다)에 따른 명령, 같은 조 제5항이나 제35조(제70조제4항에서 준용하는 경우를 포함한다)를 위반하게 한 경우\n7. 제31조(제70조제4항에서 준용하는 경우를 포함한다)를 위반하여 금고나 중앙회로 하여금 동산이나 부동산을 소유하게 한 경우\n8. 제44조에 따라 준용되는 「민법」의 규정을 위반한 경우\n9. 감독기관의 검사를 거부ㆍ방해 또는 기피하거나 해당 검사원의 질문에 거짓으로 진술(서면진술을 포함한다)하거나 자료를 제출한 경우\n10. 제75조에 따른 경영 공시를 이행하지 아니하거나 거짓으로 공시한 경우\n③ 제22조제2항부터 제4항까지 및 제22조의2(제64조의2제6항에서 준용하는 경우를 포함한다)를 위반한 자는 2년 이하의 징역이나 2천만원 이하의 벌금에 처한다. \u003c신설 2011.3.8, 2014.6.11, 2023.4.11>\n④ 제5조를 위반하여 금고나 중앙회로 하여금 정치에 관여하는 행위를 하게 한 자는 다른 법률에 특별히 규정된 경우 외에는 1년 이하의 징역이나 1천만원 이하의 벌금에 처한다. \u003c개정 2011.3.8, 2014.6.11>\n⑤ 제2조제5항을 위반한 자는 1년 이하의 징역이나 1천만원 이하의 벌금에 처한다. \u003c개정 2011.3.8, 2014.6.11>\n⑥ 제3항에 따른 죄의 공소시효는 해당 선거일 후 6개월(선거일 후에 이루어진 범죄는 그 행위를 한 날부터 6개월)을 경과함으로써 완성된다. 다만, 범인이 도피하거나 범인이 공범 또는 증명에 필요한 참고인을 도피시킨 경우에는 그 기간을 3년으로 한다. \u003c신설 2017.12.26>"},"시행령_제2조":{"title":"새마을금고법 시행령 제2조(설립절차)","text":"제2조(설립절차)\n① 「새마을금고법」(이하 \"법\"이라 한다) 제7조에 따라 새마을금고(이하 \"금고\"라 한다)를 설립하려는 발기인은 정관안과 사업계획안을 작성하고, 다음 각 호의 사항을 15일 이상 공고한 후 창립총회를 개최하여야 한다.\n1. 창립총회의 일시 및 장소\n2. 회원의 자격\n3. 창립총회에 부칠 사항\n② 제1항의 공고는 금고의 주된 사무소 게시판에 게시하는 방법으로 한다.\n③ 다음 각 호의 사항은 창립총회의 의결을 얻어야 한다.\n1. 정관안\n2. 사업계획안\n3. 임원의 선임\n4. 설립경비에 관한 사항 등 설립에 필요한 사항"},"시행령_제3조":{"title":"새마을금고법 시행령 제3조(설립인가 신청)","text":"제3조(설립인가 신청)\n① 법 제7조에 따라 발기인이 금고의 설립인가를 받으려는 때에는 설립인가 신청서에 다음 각 호의 서류를 첨부하여 중앙회장(이하\"회장\"이라 한다)을 거쳐 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)에게 설립인가 신청을 해야 한다. \u003c개정 2008.2.29, 2011.9.9, 2013.3.23, 2014.11.19, 2017.7.26, 2020.9.8>\n1. 정관\n2. 창립총회 의사록 사본\n3. 사업계획서\n4. 발기인 대표와 임원의 이력서 및 취임승낙서\n5. 금고 설립 동의서를 제출한 자의 명부\n② 금고의 설립이 법 제37조에 따른 합병으로 인한 것이면 제1항 각 호의 서류 외에 그 설립되는 금고가 승계할 권리ㆍ의무의 범위를 의결한 합병총회의 의사록 사본을 첨부하여야 한다.\n③ 회장은 제1항에 따른 설립인가 신청서를 받은 날부터 30일 이내에 의견을 붙여 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장에게 제출해야 한다. \u003c신설 2011.9.9, 2013.3.23, 2014.11.19, 2017.7.26, 2020.9.8>\n④ 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장은 제3항에 따라 회장으로부터 설립인가 신청서를 받은 날부터 60일 이내에 인가 여부를 신청인에게 알려야 한다. \u003c개정 2008.2.29, 2011.9.9, 2013.3.23, 2014.11.19, 2017.7.26, 2020.9.8>"},"시행령_제5조":{"title":"새마을금고법 시행령 제5조(총회 의사록)","text":"제5조 총회 의사록\n법 제12조제6항의 총회 의사록에는 총회의 진행 상황 및 결과를 적고, 의장과 총회에서 선출한 5명 이상의 출석회원이 기명ㆍ날인하여야 한다."},"시행령_제6조":{"title":"새마을금고법 시행령 제6조(대의원회 등)","text":"제6조(대의원회 등)\n① 법 제16조제1항에 따른 금고의 대의원회는 그 금고의 이사장과 대의원으로 구성한다.\n② 대의원의 자격은 정관으로 정하되, 회원으로 가입한 후 1년이 지난 자이어야 한다. 다만, 금고가 설립된 후 1년이 지나지 아니하였거나 직장 금고의 경우에는 그러하지 아니하다.\n③ 금고의 대의원의 수는 회원 수에 비례하여 정관으로 정하되, 100명 이상으로 한다.\n④ 대의원의 선임방법에 관하여 필요한 사항은 정관으로 정한다."},"시행령_제8조의3":{"title":"새마을금고법 시행령 제8조의3(이사장 선출방법을 선택할 수 있는 금고의 범위)","text":"제8조의3 이사장 선출방법을 선택할 수 있는 금고의 범위\n법 제18조제5항 단서에서 \"자산이 일정 규모 이하인 금고 등 대통령령으로 정하는 금고\"란 다음 각 호의 금고를 말한다. \u003c개정 2025.6.25>\n\n1. 이사장을 선출하는 연도의 전전 사업연도의 결산보고서에 적힌 자산총액이 2,000억원 미만인 지역금고\n2. 지역금고 외의 금고"},"시행령_제9조":{"title":"새마을금고법 시행령 제9조(임원의 해임)","text":"제9조(임원의 해임)\n① 법 제19조제8항에 따라 총회에서 임원의 해임의결을 하려면 재적회원 3분의 1 이상의 요구가 있어야 한다.\n② 이사장은 제1항에 따른 해임 요구가 있으면 늦어도 총회 개최일 7일 전까지 해당 임원에게 해임 요구에 관한 사항을 알리고 총회에서 변명할 기회를 주어야 한다.\n③ 임원의 해임에 관하여 그 밖에 필요한 사항은 정관으로 정한다."}}};
const DATA={id:'root',t:COURSE.meta.title,sub:COURSE.meta.subtitle,c:COURSE.branches};
(function normalizeCourse(n){
  (n.c||[]).forEach(normalizeCourse);
})(DATA);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
document.getElementById('legalStatus').textContent=COURSE.meta.kicker||'';
const kakaoLink=document.getElementById('kakaoLink');
if(COURSE.meta.kakaoUrl) kakaoLink.href=COURSE.meta.kakaoUrl; else kakaoLink.style.display='none';


/* ══════════════ 공통 인덱싱 ══════════════ */
const HUE={A:['--hA','--hA2'],B:['--hB','--hB2'],C:['--hC','--hC2'],D:['--hD','--hD2'],E:['--hE','--hE2']};
const BR=['A','B','C','D','E'];
const byId={}, parentOf={};
(function idx(n,p,br){
  byId[n.id]=n; parentOf[n.id]=p;
  if(BR.includes(n.id)) br=n.id;
  n.br=br||null;
  (n.c||[]).forEach(k=>idx(k,n,br));
})(DATA,null,null);
const accOf=n=>n.br?`var(${HUE[n.br][0]})`:'var(--root1)';
const acc2Of=n=>n.br?`var(${HUE[n.br][1]})`:'var(--canvas)';
function count(n){ return n.c ? n.c.reduce((a,k)=>a+count(k),0) : 1; }

/* 프레젠터 클리커(다음/이전)용 발표 순서 — 트리 전체를 문서 순서로 평탄화 */
const STEPS=[];
(function flatten(n){ STEPS.push(n); (n.c||[]).forEach(flatten); })(DATA);
const stepIdxOf={}; STEPS.forEach((n,i)=>stepIdxOf[n.id]=i);
let stepIndex=0;
let lastFwdTime=0, lastBackTime=0;

const MOBILE_QUERY='(max-width:1024px) and (orientation:portrait)';
const isMobile=()=>window.matchMedia(MOBILE_QUERY).matches;
const expanded=new Set(['root']);
let PRESENT=false, focusBranch=null;

/* ══════════════ 데스크톱 트리 레이아웃 ══════════════ */
const stage=document.getElementById('stage'),
      world=document.getElementById('world'),
      wires=document.getElementById('wires');

const COLX=[30,330,650,1010];
const SLOT={1:80,2:66,3:62};
const GAPD={1:34,2:16,3:8};
const MIN_S=0.24, MAX_S=2.8;
let view={x:60,y:40,s:.82};

function layout(){
  let cursor=20;
  (function walk(n,d){
    n.depth=d;
    const open=(d===0)||(expanded.has(n.id)&&n.c&&n.c.length);
    if(open && n.c && n.c.length){
      n.c.forEach(k=>walk(k,d+1));
      n.y=(n.c[0].y+n.c[n.c.length-1].y)/2;
    }else{
      const h=SLOT[d]||56;
      n.y=cursor+h/2; cursor+=h+(GAPD[d]||8);
    }
  })(DATA,0);
  return cursor;
}

function nodeHTML(n){
  const open=expanded.has(n.id)&&n.c&&n.c.length;
  let html=`<div class="node d${n.depth}${n.depth===3&&sheetOpenId===n.id?' active':''}" style="--ac:${accOf(n)};--ac2:${acc2Of(n)}" data-id="${n.id}">`;
  if(n.depth===0){
    html+=`<div><span class="txt">${n.t}</span><div class="sub">${n.sub}</div></div>`;
  }else if(n.depth===1){
    html+=`<span class="txt">${n.t}</span><span class="cnt">${count(n)}</span>`;
  }else if(n.depth===2){
    html+=`<span class="dot"></span><span class="txt">${n.t}</span>`;
  }else{
    html+=`<span class="sn">${n.n}</span><span class="txt">${n.t}</span>`;
  }
  if(n.c){
    html+=`<div class="toggle${open?' open':''}">${open?'−':'+'}</div>`;
  }else{
    html+=`<div class="toggle" style="border-color:${accOf(n)}">›</div>`;
  }
  html+=`</div>`;
  return html;
}

function bez(x1,y1,x2,y2){
  const dx=Math.max(60,(x2-x1)*.55);
  return `M${x1} ${y1} C${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
}

let sheetOpenId=null;

function drawDesktop(animate){
  const totalH=layout();
  world.querySelectorAll('.nodewrap').forEach(e=>e.remove());
  const order=[];
  (function collect(n){ order.push(n); if(expanded.has(n.id)||n.depth===0) (n.c||[]).forEach(collect); })(DATA);

  order.forEach((n,i)=>{
    const wrap=document.createElement('div');
    wrap.className='nodewrap'+(focusBranch&&n.br&&n.br!==focusBranch?' dim':'');
    wrap.style.left=COLX[n.depth]+'px';
    wrap.style.top=(n.y-(SLOT[n.depth]||76)/2)+'px';
    wrap.style.animationDelay=animate?(Math.min(i,26)*22)+'ms':'0ms';
    wrap.innerHTML=nodeHTML(n);
    world.appendChild(wrap);
    const el=wrap.querySelector('.node');
    if(PRESENT && focusBranch && n.id===focusBranch) el.classList.add('active-branch');
    const act=()=>{
      stepIndex=stepIdxOf[n.id]; updateStepBadge();
      if(n.c){
        if(n.depth===1){
          const sameOpen=focusBranch===n.id && expanded.has(n.id);
          if(sameOpen){ collapseNode(n); clearFocus(); }
          else{ activateBranch(n.id); }
        }else{
          expanded.has(n.id)?collapseNode(n):expanded.add(n.id);
        }
        drawDesktop(true); scheduleFit();
      }else openSheet(n);
    };
    el.onclick=act;
    el.tabIndex=0;
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}};
  });

  // wires
  let svg='';
  order.forEach(n=>{
    if(!expanded.has(n.id)||!n.c) return;
    n.c.forEach(k=>{
      const w1=nodeMeasuredW(n), x1=COLX[n.depth]+w1+13, y1=n.y;
      const x2=COLX[k.depth]-2, y2=k.y;
      const dim=focusBranch&&k.br&&k.br!==focusBranch;
      svg+=`<path class="wire${dim?' dim':''}" d="${bez(x1,y1,x2,y2)}" stroke-width="${k.depth===1?2.6:1.8}" style="stroke:${accOf(k)};stroke-dasharray:1200;stroke-dashoffset:${animate?1200:0};animation:${animate?'drawLine .7s var(--ease) forwards':'none'};animation-delay:${animate?'80ms':'0ms'}"/>`;
    });
  });
  wires.innerHTML=svg;
  wires.setAttribute('width',COLX[3]+420);
  wires.setAttribute('height',Math.max(totalH+40,700));

  // 실제 렌더 폭 재측정 후 wire 재계산 (auto-width라 1프레임 뒤 보정)
  requestAnimationFrame(()=>{
    let svg2='';
    order.forEach(n=>{
      if(!expanded.has(n.id)||!n.c) return;
      n.c.forEach(k=>{
        const w1=nodeMeasuredW(n), x1=COLX[n.depth]+w1+13, y1=n.y;
        const x2=COLX[k.depth]-2, y2=k.y;
        const dim=focusBranch&&k.br&&k.br!==focusBranch;
        svg2+=`<path class="wire${dim?' dim':''}" d="${bez(x1,y1,x2,y2)}" style="stroke:${accOf(k)};stroke-width:${k.depth===1?2.6:1.8}"/>`;
      });
    });
    wires.innerHTML=svg2;
  });
}
function nodeBox(n){
  const el=world.querySelector('.nodewrap .node[data-id="'+n.id+'"]');
  if(el) return {w:el.offsetWidth,h:el.offsetHeight};
  return {w:n.depth===0?260:n.depth===1?190:n.depth===2?190:230,
           h:n.depth===0?76:n.depth===1?58:n.depth===2?50:50};
}
function nodeMeasuredW(n){ return nodeBox(n).w; }
function collapseNode(n){ expanded.delete(n.id); (n.c||[]).forEach(collapseNode); if(focusBranch===n.id) clearFocus(); }
function collapseOtherBranches(activeId){
  BR.forEach(id=>{ if(id!==activeId) collapseNode(byId[id]); });
}
function activateBranch(id){
  collapseOtherBranches(id);
  expanded.add(id);
  setFocus(id);
}

/* ── 포커스(브랜치 집중) ── */
function setFocus(id){ focusBranch=id; document.getElementById('unfocus').classList.add('on'); updateLegendState(); }
function clearFocus(){ focusBranch=null; document.getElementById('unfocus').classList.remove('on'); updateLegendState(); }
document.getElementById('unfocus').onclick=()=>{clearFocus();stepIndex=0;updateStepBadge();drawDesktop(true);scheduleFit();};

/* ══════════════ Auto-Fit 엔진 ══════════════
   클릭 · 확장 · 포커스 · 리사이즈 · 전체화면 전환마다
   "지금 봐야 할 노드들"을 계산해 화면 가득 자동으로 맞춘다. */
function availableRect(){
  const header=document.querySelector('header').offsetHeight;
  let sheetW=0;
  if(sheet.classList.contains('on')) sheetW=sheet.offsetWidth;
  const padX=36, padTop=20, padBottom=54;
  const w=Math.max(240, innerWidth - sheetW - padX*2);
  const h=Math.max(220, innerHeight - header - padTop - padBottom);
  return {x:padX, y:header+padTop, w, h};
}
function boundsOf(nodes){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(n=>{
    const b=nodeBox(n);
    const x0=COLX[n.depth], x1=x0+b.w+18;
    const y0=n.y-b.h/2, y1=n.y+b.h/2;
    if(x0<minX)minX=x0; if(x1>maxX)maxX=x1;
    if(y0<minY)minY=y0; if(y1>maxY)maxY=y1;
  });
  return {minX,minY,maxX,maxY};
}
function currentFitSet(){
  if(focusBranch){
    const b=byId[focusBranch];
    const nodes=[b];
    (function collect(n){ (n.c||[]).forEach(k=>{ if(expanded.has(n.id)){ nodes.push(k); collect(k); } }); })(b);
    return nodes;
  }
  const nodes=[];
  (function collect(n){ nodes.push(n); if(expanded.has(n.id)||n.depth===0) (n.c||[]).forEach(collect); })(DATA);
  return nodes;
}
let fitRaf=null;
function scheduleFit(instant){
  if(isMobile()) return;
  cancelAnimationFrame(fitRaf);
  fitRaf=requestAnimationFrame(()=>{
    const nodes=currentFitSet();
    if(!nodes.length) return;
    const {minX,minY,maxX,maxY}=boundsOf(nodes);
    const rect=availableRect();
    const bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY);
    let s=Math.min(rect.w/bw, rect.h/bh);
    s=Math.max(MIN_S, Math.min(MAX_S, s));
    if(instant) world.classList.add('instant');
    view.s=s;
    view.x=rect.x + rect.w/2 - (minX+maxX)/2*s;
    view.y=rect.y + rect.h/2 - (minY+maxY)/2*s;
    apply();
    if(instant) requestAnimationFrame(()=>requestAnimationFrame(()=>world.classList.remove('instant')));
  });
}
function home(){ scheduleFit(true); } // 구버전 호출부 대응용 별칭

/* 팬 · 휠줌 · 핀치줌(터치) */
let drag=null;
const pointers=new Map();
let pinch=null;
stage.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    drag=null; world.classList.add('instant');
    const pts=[...pointers.values()];
    pinch={dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),scale:view.s,
           cx:(pts[0].x+pts[1].x)/2, cy:(pts[0].y+pts[1].y)/2};
  }else if(pointers.size===1){
    if(e.target.closest('.node')||e.target.closest('.toggle'))return;
    world.classList.add('instant');
    drag={px:e.clientX,py:e.clientY,x:view.x,y:view.y};
    stage.classList.add('drag');
  }
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
});
stage.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && pointers.size===2){
    const pts=[...pointers.values()];
    const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    const ns=Math.min(MAX_S,Math.max(MIN_S,pinch.scale*(dist/pinch.dist)));
    const r=stage.getBoundingClientRect(), mx=pinch.cx-r.left, my=pinch.cy-r.top;
    view.x=mx-(mx-view.x)*(ns/view.s); view.y=my-(my-view.y)*(ns/view.s); view.s=ns; apply();
    return;
  }
  if(!drag)return;
  view.x=drag.x+(e.clientX-drag.px); view.y=drag.y+(e.clientY-drag.py); apply();
});
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,e=>{
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(pointers.size===0){ drag=null; stage.classList.remove('drag'); setTimeout(()=>world.classList.remove('instant'),50); }
}));
stage.addEventListener('wheel',e=>{
  e.preventDefault(); world.classList.add('instant');
  const f=Math.exp(-e.deltaY*0.0012), ns=Math.min(MAX_S,Math.max(MIN_S,view.s*f));
  const r=stage.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  view.x=mx-(mx-view.x)*(ns/view.s); view.y=my-(my-view.y)*(ns/view.s); view.s=ns; apply();
  clearTimeout(stage._t); stage._t=setTimeout(()=>world.classList.remove('instant'),120);
},{passive:false});
function apply(){ world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`; }
function zoom(f){
  const ns=Math.min(MAX_S,Math.max(MIN_S,view.s*f)), cx=innerWidth/2, cy=innerHeight/2;
  view.x=cx-(cx-view.x)*(ns/view.s); view.y=cy-(cy-view.y)*(ns/view.s); view.s=ns; apply();
}

/* ══════════════ 프레젠터 클리커(로지텍 Spotlight 등) 내비게이션 ══════════════
   다음/이전 버튼(→/←, PageDown/Up, Space)만으로 화면을 조준하지 않고도
   가지→카테고리→카드 순서대로 자동 드릴다운/백 이동한다. */
function goToStep(idx){
  if(isMobile()) return;
  idx=Math.max(0,Math.min(STEPS.length-1,idx));
  stepIndex=idx;
  const n=STEPS[idx];
  if(n.br) activateBranch(n.br); else clearFocus();
  let p=parentOf[n.id];
  while(p){ expanded.add(p.id); p=parentOf[p.id]; }
  if(n.c){
    expanded.add(n.id);
    drawDesktop(true);
    scheduleFit();
  }else{
    drawDesktop(true);
    openSheet(n);
  }
  updateStepBadge();
}
function updateStepBadge(){
  const el=document.getElementById('stepBadge');
  if(!el) return;
  const n=STEPS[stepIndex];
  el.innerHTML=`<b>${stepIndex+1}</b> / ${STEPS.length} <span>${n.t}</span>`;
}
/* 두 번 빠르게 누르면(더블탭) 카드 단위를 건너뛰고 다음/이전 카테고리·영역으로 이동 */
function skipStep(dir){
  let idx=stepIndex;
  do{ idx+=dir; }while(idx>0 && idx<STEPS.length-1 && STEPS[idx].depth===3);
  goToStep(idx);
  flashSkip(dir);
}
function flashSkip(dir){
  const el=document.getElementById('stepBadge');
  if(!el) return;
  el.classList.remove('skip-fwd','skip-back');
  void el.offsetWidth;
  el.classList.add(dir>0?'skip-fwd':'skip-back');
}

const sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
function openSheet(n){
  sheetOpenId=n.id;
  const c=n.card, p=parentOf[n.id];
  sheet.style.setProperty('--ac',accOf(n));
  document.getElementById('shEye').textContent=`${byId[parentOf[p.id].id].t} · ${p.t}`;

      <span class="recall-q">${esc(r.prompt)}</span>

    </button>`).join('');
  const lawItems=(c.lawKeys||[]).map((key,i)=>{
    const src=COURSE.legalTexts?.[key];

    return `<details class="law-article" ${i===0?'open':''}><summary>${esc(src.title)}</summary><pre class="law-text">${esc(src.text)}</pre></details>`;
  }).join('');
  body.innerHTML=`

    <div class="blk"><h4>ANKI 핵심단어 · 빈칸 회상</h4><div class="recall-list">${recall}</div></div>
    <div class="blk"><h4>쉬운 말 풀이</h4><p class="easy">${esc(c.e)}</p></div>
    ${c.hook?`<div class="blk"><h4>암기 포인트</h4><p class="easy">${esc(c.hook)}</p></div>`:''}
    <div class="blk"><h4>근거 조문 · 원문</h4><span class="lawtag">${esc(c.l)}</span><div class="law-list">${lawItems}</div></div>`;
  body.querySelectorAll('.recall-card').forEach(btn=>{
    btn.onclick=()=>{
      const on=btn.classList.toggle('revealed');
      btn.setAttribute('aria-expanded',on?'true':'false');
      const hint=btn.querySelector('.recall-hint');
      if(hint) hint.textContent=on?'다시 눌러 가리기':'눌러서 중요단어 확인';
    };
  });
  body.scrollTop=0;
  sheet.classList.add('on'); scrim.classList.add('on');

function closeSheet(){
  sheetOpenId=null;
  sheet.classList.remove('on'); scrim.classList.remove('on');
  if(!isMobile()){ drawDesktop(false); scheduleFit(); }
}
scrim.onclick=closeSheet;

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(sheet.classList.contains('on')) closeSheet(); else if(focusBranch){clearFocus();drawDesktop(true);scheduleFit();} }
  if(!isMobile() && /^[1-5]$/.test(e.key)){
    const b=byId[BR[+e.key-1]];
    activateBranch(b.id); stepIndex=stepIdxOf[b.id]; updateStepBadge();
    drawDesktop(true); scheduleFit();
  }
  if(e.key.toLowerCase()==='f') document.getElementById('btnPresent').click();

  if(isMobile()) return;
  const fwd = e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'||(e.code==='Space'&&!e.shiftKey);
  const back = e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'||e.key==='Backspace'||(e.code==='Space'&&e.shiftKey);
  const now=Date.now();
  if(fwd){
    e.preventDefault();
    if(now-lastFwdTime<420){ lastFwdTime=0; skipStep(+1); }
    else{ lastFwdTime=now; goToStep(stepIndex+1); }
  }else if(back){
    e.preventDefault();
    if(now-lastBackTime<420){ lastBackTime=0; skipStep(-1); }
    else{ lastBackTime=now; goToStep(stepIndex-1); }
  }
  else if(e.key==='Home'){ e.preventDefault(); goToStep(0); }
  else if(e.key==='End'){ e.preventDefault(); goToStep(STEPS.length-1); }
});

/* 정답 파티클 */
function burstAt(x,y,color){
  const wrap=document.createElement('div'); wrap.className='burstwrap'; document.body.appendChild(wrap);
  for(let i=0;i<14;i++){
    const p=document.createElement('div'); p.className='p';
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*70;
    p.style.left=x+'px'; p.style.top=y+'px';
    p.style.background=color;
    p.style.setProperty('--tx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--ty',Math.sin(ang)*dist+'px');
    p.style.animationDelay=(Math.random()*60)+'ms';
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.remove(),900);
}

async function requestLandscapeView(){

function handleViewportChange(){
  const nowM=isMobile();
  if(nowM!==wasM){
    if(nowM) syncMobileFromDesktop(); else syncDesktopFromMobilePath();
    wasM=nowM; render();
    if(!nowM) setTimeout(()=>home(),80);
    return;
  }
  if(!nowM){ clearTimeout(resizeT); resizeT=setTimeout(()=>scheduleFit(true),100); }
}
addEventListener('resize',handleViewportChange);
addEventListener('orientationchange',()=>setTimeout(handleViewportChange,180));
render();
if(!isMobile()) scheduleFit(true);
</script>
</body>
</html>
