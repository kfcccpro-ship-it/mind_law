<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새마을금고법 학습 마인드맵 · 현행법 점검본</title>
<meta name="description" content="새마을금고법을 구조·학습카드·퀴즈로 익히는 비공식 학습 마인드맵">
<meta name="theme-color" content="#F4F5F7">
<style>
:root{
  --bg:#F4F5F7; --canvas:#EEF0F3; --surface:#FFFFFF;
  --ink:#1A1B1E; --ink2:#6B6F76; --ink3:#A7ABB2;
  --sep:rgba(20,20,25,.08);
  --shadow:0 1px 3px rgba(16,18,24,.06),0 6px 18px rgba(16,18,24,.07);
  --shadow-lg:0 8px 20px rgba(16,18,24,.12),0 30px 70px rgba(16,18,24,.18);
  --ease:cubic-bezier(.22,.9,.32,1);
  --easeSpring:cubic-bezier(.34,1.56,.64,1);
  --font:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  /* 5개 영역 색상 */
  --hA:#3D6CFF; --hA2:#EAF0FF;
  --hB:#0FA968; --hB2:#E6F8EF;
  --hC:#E08A00; --hC2:#FFF3DF;
  --hD:#9552E8; --hD2:#F4EBFF;
  --hE:#E4436A; --hE2:#FFEAF0;
  --root1:#22242B; --root2:#43465A;
}
.present{
  --bg:#06070B; --canvas:#0A0C12; --surface:#14161F;
  --ink:#F3F4F8; --ink2:#9A9EAC; --ink3:#5B5F6C;
  --sep:rgba(255,255,255,.09);
  --shadow:0 2px 8px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  --hA2:rgba(61,108,255,.16); --hB2:rgba(15,169,104,.16);
  --hC2:rgba(224,138,0,.18); --hD2:rgba(149,82,232,.18); --hE2:rgba(228,67,106,.18);
  --root1:#F3F4F8; --root2:#C9CCDA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  overflow:hidden;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  transition:background .5s var(--ease),color .5s var(--ease);
}
:focus-visible{outline:2px solid var(--hA);outline-offset:3px;border-radius:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.55)}65%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 var(--ac-glow)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes burst{to{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:.01ms !important}}

/* ── 헤더 ─────────────────────────────── */
header{
  position:fixed;top:0;left:0;right:0;height:60px;z-index:90;
  display:flex;align-items:center;gap:10px;padding:0 18px;
  padding-top:env(safe-area-inset-top);height:calc(60px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 70%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);transition:background .5s var(--ease),border-color .5s;
}
.brand{font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.brand b{
  background:linear-gradient(90deg,var(--root1),var(--hA),var(--hD),var(--root1));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 9s linear infinite;
}
.brand span{color:var(--ink3);font-weight:500;font-size:12.5px}
.status-pill{display:inline-flex;align-items:center;flex:none;height:30px;padding:0 10px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-size:10.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
.kakao-link{display:inline-flex;align-items:center;gap:6px;flex:none;height:32px;padding:0 11px;border-radius:10px;background:#FEE500;color:#191919;text-decoration:none;font-size:11.5px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap;transition:transform .2s var(--easeSpring),filter .2s}
.kakao-link:hover{transform:translateY(-1px);filter:brightness(.98)}
.kakao-link:active{transform:scale(.97)}
.kakao-link .kdot{width:7px;height:7px;border-radius:50%;background:#191919;flex:none}
@media (max-width:980px){.status-pill{display:none}.brand span{display:none}.legend{max-width:24vw}}
@media (max-width:640px){header{padding-left:12px;padding-right:10px;gap:7px}.brand{font-size:14px}.legend{display:none!important}.kakao-link{font-size:10.5px;padding:0 9px}.tools{display:none!important}}
.legend{display:flex;gap:5px;margin-left:14px;overflow-x:auto;scrollbar-width:none;max-width:30vw}
.legend::-webkit-scrollbar{display:none}
.leg{
  border:none;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:700;flex:none;
  padding:6px 11px;border-radius:20px;color:#fff;opacity:.9;letter-spacing:-.01em;
  transition:transform .2s var(--easeSpring),opacity .2s,box-shadow .2s;white-space:nowrap;
}
.leg:hover{opacity:1;transform:translateY(-1px)}
.leg.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px currentColor;opacity:1}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;max-width:60vw}
.tools::-webkit-scrollbar{display:none}
.tbtn.on{background:linear-gradient(135deg,#3D6CFF,#9552E8);color:#fff}
.tbtn{
  border:none;background:var(--surface);color:var(--ink);cursor:pointer;flex:none;
  height:34px;padding:0 14px;border-radius:10px;font-size:12.5px;font-weight:700;
  font-family:inherit;letter-spacing:-.01em;box-shadow:var(--shadow);
  transition:transform .25s var(--easeSpring),opacity .2s,background .3s;
}
.tbtn:hover{opacity:.75}
.tbtn:active{transform:scale(.92)}
.tbtn.icon{width:34px;padding:0;font-size:17px;line-height:1}
.tbtn.present{background:linear-gradient(135deg,#3D6CFF,#9552E8);color:#fff}
.tbtn.present.on{background:linear-gradient(135deg,#E4436A,#E08A00)}

/* ── 캔버스 ───────────────────────────── */
#stage{position:fixed;inset:0;top:0;overflow:hidden;cursor:grab;touch-action:none;background:var(--canvas);
  transition:background .5s var(--ease)}
#stage.drag{cursor:grabbing}
#stage::before{ /* 은은한 그리드 */
  content:"";position:absolute;inset:-2000px;pointer-events:none;opacity:.5;
  background-image:radial-gradient(var(--sep) 1px,transparent 1px);background-size:26px 26px;
}
.present #stage::before{opacity:.35}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;
  transition:transform .55s var(--ease)}
#world.instant{transition:none}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.wire{fill:none;stroke-linecap:round}
.wire.dim{opacity:.08}

.nodewrap{position:absolute;display:flex;align-items:center;animation:popIn .5s var(--easeSpring) both}
.node{
  position:relative;display:flex;align-items:center;gap:10px;
  border-radius:17px;box-shadow:var(--shadow);cursor:pointer;padding:0 18px;
  transition:transform .28s var(--easeSpring),box-shadow .3s var(--ease),opacity .4s,filter .4s;
  white-space:nowrap;width:max-content;
}
.node:hover{transform:translateY(-2px) scale(1.015);box-shadow:var(--shadow-lg)}
.node:active{transform:scale(.98)}
.node .txt{font-weight:700;letter-spacing:-.015em;line-height:1.25;white-space:normal;max-width:100%}
.nodewrap.dim{opacity:.16;filter:saturate(.3)}
.nodewrap.dim .node:hover{transform:none;box-shadow:var(--shadow)}

/* depth별 스타일 */
.node.d0{background:linear-gradient(135deg,var(--root1),var(--root2));height:76px;padding:0 26px;border-radius:22px}
.node.d0 .txt{color:var(--bg);font-size:21px;font-weight:900}
.node.d0 .sub{font-size:11.5px;font-weight:600;opacity:.55;margin-top:3px;color:var(--bg)}

.node.d1{height:58px;color:#fff;font-size:16px;background:var(--ac)}
.node.d1 .txt{font-size:16px}
.node.d1 .cnt{font-size:10.5px;font-weight:800;opacity:.85;background:rgba(255,255,255,.22);
  border-radius:20px;padding:2px 8px;margin-left:2px}

.node.d2{height:50px;background:var(--ac2);color:var(--ink);border:1.5px solid transparent}
.node.d2 .txt{font-size:14.5px;color:var(--ink)}
.node.d2 .dot{width:7px;height:7px;border-radius:50%;background:var(--ac);flex:none}

.node.d3{height:50px;background:var(--surface);border:1.5px solid var(--sep)}
.node.d3 .txt{font-size:13.5px;font-weight:600;color:var(--ink2)}
.node.d3 .sn{flex:none;width:22px;height:22px;border-radius:7px;background:var(--ac2);
  color:var(--ac);font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center}
.node.d3.active{background:var(--ac);border-color:transparent}
.node.d3.active .txt{color:#fff}
.node.d3.active .sn{background:rgba(255,255,255,.28);color:#fff}

.node.active-branch{animation:pulseRing 1.8s var(--ease) infinite}

.toggle{
  position:absolute;top:50%;right:-13px;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;background:var(--surface);
  border:2px solid var(--ac);color:var(--ac);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;cursor:pointer;box-shadow:var(--shadow);z-index:2;
  transition:transform .3s var(--easeSpring),background .2s;
}
.toggle:hover{transform:translateY(-50%) scale(1.15)}
.toggle.open{background:var(--ac);color:#fff}
.node.d0 .toggle{right:-14px;width:30px;height:30px;font-size:12px}

/* 발표모드 전용 확대 */
.present .node.d0 .txt{font-size:26px}
.present .node.d1{height:68px}
.present .node.d1 .txt{font-size:19px}
.present .node.d2{height:58px}
.present .node.d2 .txt{font-size:17px}
.present .node.d3{height:58px}
.present .node.d3 .txt{font-size:16px}
.present .node{box-shadow:0 0 0 1px var(--sep),var(--shadow-lg)}
.present .node.d1,.present .node.d2.active,.present .node.d3.active{
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 55%,transparent),0 0 26px color-mix(in srgb,var(--ac) 45%,transparent),var(--shadow-lg);
}

/* 포커스 해제 버튼 */
#unfocus{
  position:fixed;left:20px;bottom:20px;z-index:55;border:none;cursor:pointer;
  background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:12.5px;
  padding:10px 16px;border-radius:24px;box-shadow:var(--shadow-lg);display:none;align-items:center;gap:8px;
  animation:fadeUp .3s var(--ease);
}
#unfocus.on{display:flex}
#unfocus .x{width:16px;height:16px;border-radius:50%;background:var(--ink3);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:9px}

/* 힌트 */
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;
  font-size:11.5px;color:var(--ink3);font-weight:600;letter-spacing:-.01em;
  background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(8px);
  padding:8px 16px;border-radius:20px;pointer-events:none;transition:opacity .4s}
#hint.hide{opacity:0}
#stepBadge{position:fixed;right:20px;bottom:20px;z-index:55;
  font-size:12px;font-weight:700;color:var(--ink);letter-spacing:-.01em;
  background:var(--surface);box-shadow:var(--shadow-lg);padding:9px 16px;border-radius:24px;
  display:flex;align-items:center;gap:7px;pointer-events:none;max-width:46vw}
#stepBadge b{color:#fff;background:linear-gradient(135deg,#3D6CFF,#9552E8);
  border-radius:20px;padding:2px 9px;font-size:11px}
#stepBadge span{color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes skipFlash{0%{transform:scale(1.14);box-shadow:0 0 0 3px var(--fc)}100%{transform:scale(1);box-shadow:var(--shadow-lg)}}
#stepBadge.skip-fwd{--fc:#3D6CFF;animation:skipFlash .5s var(--easeSpring)}
#stepBadge.skip-back{--fc:#E4436A;animation:skipFlash .5s var(--easeSpring)}

/* ── 모바일 드릴다운 ────────────────────── */
#mobile{position:fixed;inset:0;top:calc(60px + env(safe-area-inset-top));
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;
  padding:0 16px calc(40px + env(safe-area-inset-bottom))}
#crumb{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:12px 0 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);font-size:13px;color:var(--ink2)}
#crumb .back{border:none;background:none;color:var(--hA);font:inherit;font-weight:700;
  cursor:pointer;padding:0;display:flex;align-items:center;gap:3px}
#mtitle{font-size:27px;font-weight:900;letter-spacing:-.03em;margin:6px 0 4px}
#mdesc{font-size:14px;color:var(--ink2);margin:0 0 18px;line-height:1.5}
.mlist{display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;align-items:center;gap:12px;background:var(--surface);
  border-radius:16px;padding:16px 17px;cursor:pointer;box-shadow:var(--shadow);
  border:.5px solid var(--sep);transition:transform .2s var(--easeSpring);animation:fadeUp .4s var(--ease) both}
.mrow:active{transform:scale(.97)}
.mrow .bar{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}
.mrow .mt{font-size:15.5px;font-weight:700;letter-spacing:-.015em;flex:1;line-height:1.35}
.mrow .mc{font-size:11.5px;font-weight:800;color:#fff;background:var(--ac);border-radius:20px;
  padding:3px 9px;flex:none}
.mrow .ar{color:var(--ink3);font-size:16px;flex:none}

/* ── 상세 시트 ─────────────────────────── */
#scrim{position:fixed;inset:0;z-index:70;background:rgba(6,7,12,.4);
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease);backdrop-filter:blur(3px)}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;z-index:80;background:var(--surface);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;transition:transform .5s var(--easeSpring);
  top:calc(60px + env(safe-area-inset-top));right:0;bottom:0;width:min(500px,92vw);border-left:.5px solid var(--sep);transform:translateX(101%);
}
#sheet.on{transform:none}
@media (max-width:640px){
  #sheet{top:auto;left:0;right:0;bottom:0;width:auto;height:92vh;
    border-radius:22px 22px 0 0;border-left:none;border-top:.5px solid var(--sep);transform:translateY(101%)}
}
.sh-head{padding:24px 26px 16px;border-bottom:.5px solid var(--sep);flex:none;position:relative}
.grip{display:none}
@media (max-width:640px){.grip{display:block;width:36px;height:5px;border-radius:3px;background:var(--sep);margin:8px auto 12px}.sh-head{padding-top:0}}
.sh-eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ac,var(--hA));margin-bottom:8px}
.sh-title{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.25;margin:0;padding-right:40px}
.sh-close{position:absolute;top:22px;right:22px;width:32px;height:32px;border:none;border-radius:50%;
  background:var(--canvas);color:var(--ink2);font-size:15px;cursor:pointer;transition:transform .2s var(--easeSpring)}
.sh-close:hover{transform:rotate(90deg)}
@media (max-width:640px){.sh-close{top:26px}}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 26px 60px;flex:1}
.blk{margin-bottom:26px;animation:fadeUp .4s var(--ease) both}
.blk h4{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);
  margin:0 0 11px;display:flex;align-items:center;gap:7px}
.blk h4::before{content:"";width:14px;height:2px;background:var(--ac,var(--hA));border-radius:1px}
.blk ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.blk li{font-size:14.5px;line-height:1.55;padding-left:16px;position:relative;letter-spacing:-.012em;color:var(--ink)}
.blk li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;
  background:var(--ac,var(--hA));opacity:.6}
.easy,.case{font-size:14.5px;line-height:1.65;letter-spacing:-.012em;margin:0;background:var(--canvas);
  border-radius:16px;padding:16px 18px;color:var(--ink)}
.case{border-left:3px solid var(--ac,var(--hA))}
.lawtag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--canvas);
  border-radius:9px;padding:8px 13px;line-height:1.5}
.note{font-size:11.5px;color:var(--ink3);margin-top:9px;line-height:1.5}
.q{font-size:15.5px;font-weight:800;line-height:1.5;margin:0 0 13px;letter-spacing:-.015em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:inherit;font-size:14px;letter-spacing:-.012em;background:var(--canvas);
  border:1.5px solid transparent;color:var(--ink);border-radius:13px;padding:13px 16px;cursor:pointer;
  line-height:1.45;transition:transform .2s var(--easeSpring),border-color .2s,background .2s}
.opt:hover:not([disabled]){transform:translateX(3px)}
.opt.ok{border-color:#0FA968;background:color-mix(in srgb,#0FA968 14%,var(--canvas))}
.opt.no{border-color:#E4436A;background:color-mix(in srgb,#E4436A 14%,var(--canvas))}
.opt[disabled]{cursor:default}
.qx{font-size:13.5px;line-height:1.6;margin:13px 0 0;padding:14px 16px;border-radius:13px;
  background:var(--canvas);color:var(--ink2);display:none;animation:fadeUp .35s var(--ease) both}
.qx.on{display:block}
.burstwrap{position:fixed;inset:0;pointer-events:none;z-index:200}
.p{position:absolute;width:8px;height:8px;border-radius:2px;animation:burst .7s ease-out forwards}
</style>
</head>
<body>

<header>
  <div class="brand"><b>새마을금고법</b><span>학습 마인드맵</span></div>
  <span class="status-pill" id="legalStatus"></span>
  <a class="kakao-link" id="kakaoLink" href="#" target="_blank" rel="noopener noreferrer"><span class="kdot"></span>카카오 오픈채팅</a>
  <div class="legend" id="legend"></div>
  <div class="tools">
    <button class="tbtn present" id="btnPresent">🎤 발표모드</button>
    <button class="tbtn" id="btnExpand">모두 펼치기</button>
    <button class="tbtn" id="btnReset">처음으로</button>
    <button class="tbtn icon" id="btnFit" title="화면 맞춤" aria-label="화면 맞춤">⤢</button>
    <button class="tbtn icon" id="btnOut" aria-label="축소">−</button>
    <button class="tbtn icon" id="btnIn" aria-label="확대">+</button>
    <button class="tbtn icon" id="btnFull" title="전체화면" aria-label="전체화면">⛶</button>
  </div>
</header>

<div id="stage"><div id="world"><svg id="wires"></svg></div></div>
<button id="unfocus"><span class="x">✕</span> 전체 보기로 돌아가기</button>
<div id="hint">드래그로 이동 · 휠로 확대축소 · ← → 한 단계 이동 · 두 번 누르면 건너뛰기 · 숫자키 1~5로 영역 포커스</div>
<div id="stepBadge"></div>

<main id="mobile">
  <div id="crumb"></div>
  <h1 id="mtitle"></h1>
  <p id="mdesc"></p>
  <div class="mlist" id="mlist"></div>
</main>

<div id="scrim"></div>
<aside id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-head">
    <div class="grip"></div>
    <div class="sh-eyebrow" id="shEye"></div>
    <h2 class="sh-title" id="shTitle"></h2>
    <button class="sh-close" id="shClose" aria-label="닫기">✕</button>
  </div>
  <div class="sh-body" id="shBody"></div>
</aside>

<script>
/* ══════════════ 데이터 ══════════════ */
const COURSE={"meta":{"id":"mg-law-mindmap","title":"새마을금고법","subtitle":"5개 영역 · 32개 학습카드","kicker":"2026.09.29 현행법 점검본","defaultView":"tree","views":["tree"],"legalBasis":"새마을금고법 및 시행령 2026.03.15 시행본을 2026.09.29 기준으로 점검","disclaimer":"비공식 학습자료입니다. 실무 적용 전 국가법령정보센터의 현행 법령과 해당 금고 정관·내부규정을 함께 확인하세요.","kakaoUrl":"https://open.kakao.com/o/gEtSyUPi"},"glossary":{},"branches":[{"id":"A","t":"① 법의 기초","a":0,"c":[{"id":"A1","t":"목적과 이념","c":[{"id":"c1","n":1,"t":"새마을금고법의 목적","card":{"s":["국민의 자주적 협동조직을 기반으로 함","우리나라 고유의 상부상조 정신에 입각","자금의 조성과 이용 및 회원의 경제적·사회적·문화적 지위 향상","지역사회 개발을 통한 건전한 국민정신 함양과 국가경제 발전에 이바지"],"e":"새마을금고법의 출발점은 자주적 협동조직과 상부상조입니다. 법은 회원의 지위 향상뿐 아니라 지역사회 개발과 국가경제 발전까지 목적에 포함합니다. 따라서 금고를 일반 영리회사와 동일하게 이해하면 뒤의 회원·출자·기관 규정을 놓치기 쉽습니다.","k":"회원이 “왜 출자금을 많이 낸 사람이 표를 더 못 받나요?”라고 물으면 → 금고는 출자금 크기가 아니라 사람을 기준으로 운영되는 협동조직이기 때문이라고 설명합니다.","l":"새마을금고법 제1조","q":[{"q":"새마을금고법 제1조의 목적에 포함되지 않는 것은?","o":["회원의 경제적·사회적·문화적 지위 향상","지역사회 개발","국가경제 발전에 이바지","출자자의 이윤 극대화"],"a":3,"x":"제1조는 협동조직·상부상조를 바탕으로 회원 지위 향상, 지역사회 개발, 국가경제 발전에 이바지함을 목적으로 합니다."}],"one":"국민의 자주적 협동조직을 기반으로 함"}}]},{"id":"A2","t":"법령의 위계","c":[{"id":"c2","n":2,"t":"법률 체계 4단계","card":{"s":["헌법 — 국가 운영의 기본사항을 정한 최고 법규범","법률 — 국회의 의결을 거쳐 제정되는 법규범","대통령령 — 법률에서 위임받은 사항과 집행에 필요한 사항","부령 — 행정각부 장관이 발하는 명령"],"e":"법규범은 상위 규범에 어긋날 수 없습니다. 학습에서는 헌법 → 법률 → 대통령령 → 부령의 기본 위계를 먼저 잡고, 새마을금고 실무에서는 법률인 새마을금고법과 그 위임을 받은 시행령·시행규칙을 함께 확인합니다.","k":"시행령 내용이 법률과 충돌하면 법률이 우선합니다. 실무에서 “시행령에 이렇게 써 있는데요”만으로 판단하면 안 되는 이유입니다.","l":"대한민국 헌법 · 새마을금고법 · 새마을금고법 시행령 · 시행규칙","q":[{"q":"법령의 효력 순위를 바르게 나열한 것은?","o":["법률 › 헌법 › 대통령령 › 부령","헌법 › 법률 › 대통령령 › 부령","헌법 › 대통령령 › 법률 › 부령","대통령령 › 헌법 › 법률 › 부령"],"a":1,"x":"헌법이 최고 규범이고, 그 아래 법률 → 대통령령 → 부령 순입니다."}],"one":"헌법 — 국가 운영의 기본사항을 정한 최고 법규범"}},{"id":"c3","n":3,"t":"새마을금고법과 다른 법률의 관계","card":{"s":["새마을금고법 — 금고의 설립·회원·기관·사업·감독 등을 규율","시행령·시행규칙 — 법률의 위임사항과 시행 세부사항을 규정","다른 법률과의 관계는 새마을금고법 제6조와 개별 준용조항을 함께 확인","임원에 관하여는 법 제26조가 민법·상법의 특정 조문을 명시적으로 준용","“금고법에 없으면 언제나 민법 적용”이라고 단순화하지 않음"],"e":"새마을금고 업무에서 다른 법률이 어떻게 적용되는지는 하나의 문장으로 정리하기 어렵습니다. 새마을금고법 자체 규정, 제6조의 다른 법률과의 관계, 그리고 제26조·제44조 등 개별 준용조항을 순서대로 확인하는 방식이 안전합니다.","k":"임원의 책임이나 직무와 관련해 민법·상법을 볼 때에는 “일반적으로 민법이 적용된다”라고 끝내지 말고, 새마을금고법이 어떤 조문을 준용하는지부터 확인합니다.","l":"새마을금고법 제6조·제26조·제44조","q":[{"q":"민법·상법과 새마을금고법의 관계에 대한 설명으로 가장 정확한 것은?","o":["금고법에 규정이 없으면 언제나 민법만 적용한다","새마을금고법의 다른 법률 관계·준용 규정을 먼저 확인한다","상법은 어떤 경우에도 적용되지 않는다","시행규칙이 법률보다 우선한다"],"a":1,"x":"다른 법률의 적용은 새마을금고법의 관계 규정과 개별 준용조항을 먼저 확인해야 합니다."}],"trap":"“특별법 우선”이라는 원칙만으로 구체 사건의 적용 법률을 자동 결정하지 않습니다.","hook":"관계 규정 → 준용 조항 → 개별 사안.","one":"새마을금고법 — 금고의 설립·회원·기관·사업·감독 등을 규율"}}]},{"id":"A3","t":"금고의 법적 성격","c":[{"id":"c4","n":4,"t":"금고의 법적 성격","card":{"s":["새마을금고법 제2조 — 금고는 이 법에 따라 설립된 비영리법인","회원이 출자하여 구성하는 회원 중심 조직","회원의 책임은 출자액을 한도로 함","회원은 출자좌수와 관계없이 원칙적으로 평등한 의결권·선거권을 가짐"],"e":"현행 법률이 직접 쓰는 표현은 “비영리법인”입니다. 사단법인·사법인 같은 학설상 분류를 법 조문 표현처럼 외우기보다, 비영리법인·회원 출자·유한책임·평등한 의결권이라는 법정 특징을 중심으로 이해하는 편이 정확합니다.","k":"출자금이 많다고 의결권이 그만큼 늘어나는 구조가 아닙니다. 다만 법 제9조제5항이 정한 범위에서는 정관으로 의결권·선거권을 제한할 수 있습니다.","l":"새마을금고법 제2조제1항, 제9조제5항·제10항","q":[{"q":"새마을금고법이 금고를 직접 정의한 법적 성격은?","o":["영리 주식회사","비영리법인","국가기관","재단법인"],"a":1,"x":"법 제2조제1항은 금고를 이 법에 따라 설립된 비영리법인으로 정의합니다."}],"trap":"학설상 분류와 법 조문의 직접 표현을 구분합니다.","hook":"법 조문 핵심: 비영리법인.","one":"새마을금고법 제2조 — 금고는 이 법에 따라 설립된 비영리법인"}},{"id":"c5","n":5,"t":"협동조합과 주식회사의 차이","card":{"s":["금고 — 회원 중심의 비영리 협동조직 ↔ 주식회사 — 주주·자본 중심","금고 의결권·선거권 — 출자좌수와 관계없이 원칙적으로 평등","정관으로 미성년자·가입 6개월 미만·고시금액 미만 출자 회원의 의결권·선거권 제한 가능","한 회원의 출자좌수 최고한도 — 총출자좌수의 15% 초과 불가","잉여금 배당 — 손실 보전·적립금 공제 후 정관 한도에서 납입출자액에 비례"],"e":"핵심은 출자좌수가 많다고 의결권·선거권이 늘어나지 않는다는 점입니다. 다만 2025년 개정으로 미성년자, 회원기간 6개월 미만, 일정 금액 미만 출자 회원은 정관에 따라 의결권·선거권을 제한할 수 있으므로 “무조건 모든 회원 1인 1표”라고만 외우면 부족합니다.","k":"의결권이 제한되지 않는 두 회원이라면 출자액의 크기와 무관하게 각자 평등한 의결권·선거권을 갖습니다. 출자액이 많다고 표가 늘어나지 않습니다.","l":"새마을금고법 제9조제4항~제6항, 제35조제10항","q":[{"q":"협동조합인 금고의 의결권 원칙은?","o":["출자금액 비례","1인 1표","예금액 비례","거래기간 비례"],"a":1,"x":"금고는 인적결합체이므로 출자 규모와 무관하게 1인 1표입니다."}],"one":"금고 — 회원 중심의 비영리 협동조직 ↔ 주식회사 — 주주·자본 중심"}}]},{"id":"A4","t":"국가 협력과 정치중립","c":[{"id":"c6","n":6,"t":"국가 등의 협력의무","card":{"s":["사업 육성 지원 — 국가 또는 지방자치단체의 금고·중앙회 사업 육성 지원","국공유재산 대여 — 필요 시 금고·중앙회에 대한 국공유재산 우선 대여·사용·수익 허용","보조금 지원 — 예산 범위 내에서 중앙회에 보조금 지급 가능"],"e":"금고는 민간 조직이지만 공익적 성격이 있어 국가가 도울 근거를 법에 넣어둔 것입니다. 다만 “지원할 수 있다”는 재량 규정이므로 자동으로 지원이 나오는 것은 아닙니다.","k":"지역 금고가 지방자치단체 소유 건물을 사무소로 우선 임차할 때 근거로 삼는 조항입니다.","l":"새마을금고법 제3조","q":[{"q":"국가 등의 협력의무에 해당하지 않는 것은?","o":["사업 육성 지원","국공유재산 우선 대여","중앙회 보조금 지급","금고 손실의 전액 보전"],"a":3,"x":"손실을 국가가 전액 보전한다는 규정은 없습니다. 손실은 원칙적으로 회원이 부담합니다."}],"one":"사업 육성 지원 — 국가 또는 지방자치단체의 금고·중앙회 사업 육성 지원"}},{"id":"c7","n":7,"t":"금고의 정치관여 금지","card":{"s":["금고와 중앙회는 정치에 관여하는 일체의 행위를 할 수 없음","금지 주체는 법 조문상 금고와 중앙회","정치관여 행위를 하게 한 자에 대한 벌칙 규정이 존재","임직원 개인의 행위는 이 조항만으로 단정하지 말고 다른 법령·내부규정과 구체 사실관계를 별도 확인"],"e":"법 제5조는 금고와 중앙회의 정치관여를 금지합니다. 개인의 정치활동 범위까지 이 조문 하나로 일반화하지 않는 것이 중요합니다. 실제 사안은 다른 법령, 선거 관련 규정, 취업규칙·내부규정과 사실관계를 함께 봐야 합니다.","k":"금고 명의·자금·시설을 이용한 정치관여 여부가 문제되는 경우에는 법 제5조와 제85조제4항을 우선 확인하고, 개인행위인지 조직행위인지 구체 사실관계를 구분합니다.","l":"새마을금고법 제5조, 제85조제4항","q":[{"q":"새마을금고법 제5조의 직접적인 금지 주체는?","o":["모든 회원 개인","금고와 중앙회","지방자치단체","모든 금융회사"],"a":1,"x":"법 제5조는 금고와 중앙회가 정치에 관여하는 일체의 행위를 할 수 없다고 규정합니다."}],"trap":"개인 정치활동의 허용·금지를 법 제5조만으로 단정하지 않습니다.","hook":"제5조 금지 주체 = 금고·중앙회.","one":"금고와 중앙회는 정치에 관여하는 일체의 행위를 할 수 없음"}}]}]},{"id":"B","t":"② 금고의 설립","a":1,"c":[{"id":"B1","t":"설립 절차","c":[{"id":"c8","n":8,"t":"설립 4단계","card":{"s":["① 발기 — 50명 이상의 발기인이 정관안·사업계획안 작성","② 공고·창립총회 — 시행령에 따라 15일 이상 공고 후 창립총회 의결","③ 설립인가 — 회장을 거쳐 특별자치시장·특별자치도지사 또는 시장·군수·구청장 인가","④ 설립등기 — 설립인가서 도달일부터 3주 이내 주된 사무소 소재지에서 등기"],"e":"“사람 모으기 → 규칙 정하기 → 허가 받기 → 등록하기” 순서입니다. 등기까지 마쳐야 비로소 법인이 됩니다. 인가만 받고 등기를 하지 않으면 아직 법인이 아닙니다.","k":"인가서를 3월 2일에 받았다면 3월 23일까지 설립등기를 마쳐야 합니다.","l":"새마을금고법 제7조·제45조, 시행령 제2조·제3조","q":[{"q":"설립등기의 기한은?","o":["인가 신청일부터 3주","인가서 도달일부터 3주","창립총회일부터 1개월","기한 제한 없음"],"a":1,"x":"인가서가 도달한 날부터 3주 이내에 설립등기를 해야 합니다."}],"one":"① 발기 — 50명 이상의 발기인이 정관안·사업계획안 작성"}}]},{"id":"B2","t":"정관","c":[{"id":"c9","n":9,"t":"정관의 기재사항","card":{"s":["목적·명칭 ","hook":"재산 = 환급·배당 / 관리 = 의결·소집·검사.","one":"학습상 재산권적 권리 — 배당·출자금 환급 등 경제적 이익과 관련"}},{"id":"c15","n":15,"t":"의결권과 선거권","card":{"s":["회원은 출자좌수와 관계없이 원칙적으로 평등한 의결권과 선거권을 가짐","정관으로 미성년자·회원기간 6개월 미만·고시금액 미만 출자 회원의 의결권·선거권 제한 가능","의결권은 다른 회원을 대리인으로 행사할 수 있고 한 회원이 최대 2명까지 대리","임원 선거는 법 제18조의 선출방법과 관련 선거규정에 따라 본인 투표 절차를 확인","임원 후보자는 법 제21조의 결격사유와 정관상 자격요건을 충족해야 함"],"e":"의결권과 선거권은 모두 원칙적으로 평등하지만 행사방법은 같지 않습니다. 법 제9조제6항이 명시적으로 대리를 허용하는 것은 의결권입니다. 임원 선거는 법 제18조와 선거 관련 규정에 따라 진행됩니다.","k":"총회 안건에 관한 의결권은 다른 회원에게 대리시킬 수 있지만, 임원선거의 구체 투표방식은 해당 선출방식과 선거규정을 따라야 합니다.","l":"새마을금고법 제9조제5항·제6항, 제18조·제21조","q":[{"q":"새마을금고법 제9조제6항이 명시적으로 대리행사를 허용하는 것은?","o":["의결권","임원 선거권 전부","피선거권","감사권"],"a":0,"x":"법 제9조제6항은 회원이 다른 회원을 대리인으로 하여 의결권을 행사할 수 있도록 규정합니다."}],"trap":"의결권 대리 규정을 선거권 대리 규정으로 확대해석하지 않습니다.","hook":"대리 명문 = 의결권.","one":"회원은 출자좌수와 관계없이 원칙적으로 평등한 의결권과 선거권을 가짐"}},{"id":"c16","n":16,"t":"소수회원권","card":{"s":["임시총회 소집 요구 — 회원 3분의 1 이상 동의","임원 해임 요구 — 시행령상 재적회원 3분의 1 이상 요구가 있어야 총회에서 해임의결 가능","검사 청구 — 재적회원 10분의 1 이상 동의","각 권리는 목적·서면요건·후속절차가 다르므로 조문을 구분해 확인"],"e":"소수회원권은 “여러 회원이 일정 비율 이상 모였을 때 행사할 수 있는 권리”를 묶어 이해하는 학습용 표현입니다. 총회 소집·임원 해임·검사 청구는 필요한 동의비율과 절차가 서로 다릅니다.","k":"재적회원 900명이라면 검사청구의 법정 동의기준은 90명 이상입니다. 임원 해임 요구는 시행령 제9조에 따라 재적회원 3분의 1 이상의 요구가 필요합니다.","l":"새마을금고법 제14조제1항·제81조제1항, 시행령 제9조제1항","q":[{"q":"검사청구권 행사에 필요한 동의 요건은?","o":["재적회원 3분의 1 이상","재적회원 10분의 1 이상","재적회원 과반수","출석회원 3분의 2 이상"],"a":1,"x":"법 제81조제1항은 재적회원 10분의 1 이상의 동의를 요구합니다."}],"trap":"총회소집·임원해임·검사청구의 비율을 서로 바꾸어 외우지 않습니다.","hook":"소집·해임 1/3, 검사 1/10.","one":"임시총회 소집 요구 — 회원 3분의 1 이상 동의"}}]},{"id":"C3","t":"회원의 의무","c":[{"id":"c17","n":17,"t":"출자·책임·경비","card":{"s":["회원이 되려면 출자 1좌 이상을 현금으로 납입","납입할 출자금은 금고에 대한 채권과 상계할 수 없음","출자금은 질권의 목적이 될 수 없음","회원의 책임은 출자액을 한도로 함","총회는 경비의 부과와 징수방법을 의결할 수 있음","계속 손실·적립금 부족 시 법 제35조의 특별절차로 자본금 감소 가능"],"e":"기존의 “회원 5대 의무”라는 묶음보다 현행법 조문에 직접 연결되는 출자·유한책임·경비·자본금 감소를 따로 보는 편이 정확합니다.","k":"회원이 “납입해야 할 출자금을 금고에 대한 내 채권과 맞바꾸자”고 해도 법 제9조제7항 때문에 상계 방식으로 출자금을 납입할 수 없습니다.","l":"새마을금고법 제9조제1항·제7항~제10항, 제12조제4항제7호, 제35조제6항","q":[{"q":"출자금에 대한 설명으로 옳은 것은?","o":["금고에 대한 채권과 상계할 수 있다","질권을 설정할 수 있다","현금 납입하며 상계·질권 설정이 제한된다","회원 책임은 무제한이다"],"a":2,"x":"법 제9조는 출자 1좌 이상을 현금으로 납입하도록 하고, 상계와 질권 설정을 제한합니다."}],"trap":"회원의 책임은 무한책임이 아니라 출자액 한도입니다.","hook":"출자 = 현금 / 상계 X / 질권 X / 책임은 출자액 한도.","one":"회원이 되려면 출자 1좌 이상을 현금으로 납입"}}]},{"id":"C4","t":"탈퇴·제명·환급","c":[{"id":"c18","n":18,"t":"회원의 탈퇴","card":{"s":["임의탈퇴 — 회원은 정관으로 정하는 바에 따라 언제라도 탈퇴 가능","당연탈퇴 — 사망(법인은 해산)","당연탈퇴 — 파산선고","당연탈퇴 — 피성년후견인이 된 경우","당연탈퇴 — 회원 자격을 잃은 경우"],"e":"법 제10조는 임의탈퇴의 구체 방식까지 “서면 통고”라고 정하지 않고 정관에 맡깁니다. 반면 사망·파산·피성년후견·회원자격 상실은 법이 직접 당연탈퇴 사유로 정합니다.","k":"실무에서 탈퇴 신청서나 서면 통지가 필요한지는 해당 금고 정관과 내부절차를 확인합니다. 법률상 핵심은 언제라도 정관에 따라 탈퇴할 수 있다는 점입니다.","l":"새마을금고법 제10조제1항~제3항","q":[{"q":"다음 중 법 제10조의 당연탈퇴 사유가 아닌 것은?","o":["사망","파산선고","피성년후견인이 됨","2년 이상 사업 미이용"],"a":3,"x":"2년 이상 계속한 사업 미이용은 법 제10조의2의 제명 사유입니다."}],"trap":"임의탈퇴 방식은 정관 사항이고, 당연탈퇴 사유는 법에 직접 열거되어 있습니다.","hook":"당연탈퇴: 사망·파산·성년후견·자격상실.","one":"임의탈퇴 — 회원은 정관으로 정하는 바에 따라 언제라도 탈퇴 가능"}},{"id":"c19","n":19,"t":"회원의 제명","card":{"s":["제명사유 — 1년 이상 장기간 대출금 상환 지체","제명사유 — 금고 사업집행 고의 방해","제명사유 — 2년 이상 계속한 사업 미이용","제명사유 — 고의 또는 중대한 과실로 금고에 직접적인 재산상 손해","절차 — 총회 10일 전까지 사유 통지 및 총회 의견진술 기회 부여","의결 — 별도 특례가 없으면 총회 일반의결 기준","효과 — 해당 금고는 제명일부터 2년간 회원가입을 제한할 수 있음"],"e":"제명은 총회 의결이 필요한 중대한 조치이므로 사전통지와 의견진술 기회가 핵심 절차입니다. 또 제명 후 2년간 재가입이 “자동 금지”되는 것이 아니라, 해당 금고가 2년간 가입을 제한할 수 있다는 규정입니다.","k":"사전 통지 없이 총회에서 곧바로 제명을 의결하면 절차 위반으로 다툼의 소지가 생깁니다.","l":"새마을금고법 제10조의2, 제13조제1항","q":[{"q":"제명 시 사유 통지 기한은?","o":["총회 개최일 3일 전까지","총회 개최일 7일 전까지","총회 개최일 10일 전까지","통지 의무 없음"],"a":2,"x":"총회 개최일 10일 전까지 제명사유를 통지하고 의견 진술 기회를 주어야 합니다."}],"one":"제명사유 — 1년 이상 장기간 대출금 상환 지체"}},{"id":"c20","n":20,"t":"출자금 환급청구권","card":{"s":["출자금 — 탈퇴 당시 회계연도의 다음 회계연도부터 정관에 따라 환급 청구 가능","예탁금·적금 — 탈퇴 후 정관으로 정하는 바에 따라 환급 청구 가능","환급청구권 소멸시효 — 출자금 2년","환급청구권 소멸시효 — 예탁금·적금 5년","금고 재산으로 채무를 다 갚을 수 없으면 정관에 따라 부담 손실액을 공제하고 출자금 환급 가능"],"e":"법률이 분명하게 구분하는 것은 출자금의 청구개시 시점과 소멸시효입니다. 출자금은 다음 회계연도부터 청구할 수 있고 2년, 예탁금·적금은 5년의 시효가 적용됩니다. 예탁금·적금의 구체 환급절차는 정관과 상품 약관도 확인합니다.","k":"3월에 탈퇴한 회원의 출자금은 탈퇴 당시 회계연도의 다음 회계연도부터 환급을 청구할 수 있습니다. 예탁금·적금은 법 제10조제4항과 해당 정관·약관을 함께 봅니다.","l":"새마을금고법 제10조제4항~제7항","q":[{"q":"환급청구권 소멸시효의 조합으로 옳은 것은?","o":["출자금 2년 / 예탁금·적금 5년","출자금 5년 / 예탁금·적금 2년","모두 2년","모두 5년"],"a":0,"x":"법 제10조제7항은 출자금 2년, 예탁금·적금 5년으로 정합니다."}],"trap":"예탁금·적금의 환급 “즉시성”을 법률이 직접 정한 것처럼 단정하지 않습니다.","hook":"환급시효: 출자 2 / 예적금 5.","one":"출자금 — 탈퇴 당시 회계연도의 다음 회계연도부터 정관에 따라 환급 청구 가능"}}]}]},{"id":"D","t":"④ 금고의 기관","a":3,"c":[{"id":"D1","t":"기관 분리의 원칙","c":[{"id":"c21","n":21,"t":"총회·이사회·감사의 역할","card":{"s":["총회 — 정관 변경·해산·합병·임원 등 중요사항 의결","이사회 — 규정·사업집행 기본방침·자금차입 등 업무집행 사항 의결","이사장 — 금고 대표 및 업무 총괄, 총회·이사회 의장","감사 — 재산과 업무집행상황을 분기마다 1회 이상 감사하고 결과 보고"],"e":"금고의 기관은 역할을 나누어 이해하면 됩니다. 총회는 중요한 기본사항, 이사회는 주요 업무집행 방침, 이사장은 대표·총괄, 감사는 감시·보고 기능을 담당합니다.","k":"정관 변경은 총회 의결사항이고, 규정의 제정·변경·폐지는 이사회 의결사항입니다. 감사는 집행기관이 아니라 감사·보고 역할을 수행합니다.","l":"새마을금고법 제12조·제17조·제19조","q":[{"q":"다음 연결 중 옳은 것은?","o":["정관 변경 — 이사회","규정 제정·변경·폐지 — 이사회","감사 — 금고의 일상 업무 총괄","이사장 — 감사 결과 승인만 담당"],"a":1,"x":"법 제17조는 규정의 제정·변경·폐지를 이사회 의결사항으로 정합니다."}],"trap":"총회와 이사회의 의결사항을 바꾸어 외우지 않습니다.","hook":"큰 틀 총회 / 집행방침 이사회 / 대표 이사장 / 감시 감사.","one":"총회 — 정관 변경·해산·합병·임원 등 중요사항 의결"}}]},{"id":"D2","t":"총회","c":[{"id":"c22","n":22,"t":"총회의 의결사항","card":{"s":["정관 변경","해산·합병·휴업","임원의 선임·해임 — 다만 이사장 선임은 정관상 총회선출 방식인 경우","기본재산의 처분","결산보고서 승인","사업계획·예산 결정","경비의 부과와 징수방법"],"e":"총회는 금고의 핵심적인 기본사항을 의결합니다. 다만 이사장 선출은 현행 법 제18조의 선출방식에 따라 회원 직접선출·총회선출·대의원회선출 등이 가능하므로 “모든 이사장은 총회에서 선출”한다고 외우면 안 됩니다.","k":"본점 기본재산 처분은 총회 의결사항입니다. 반면 일상적인 개별 여신심사는 법 제12조제4항의 총회 의결사항으로 열거되어 있지 않습니다.","l":"새마을금고법 제12조제4항, 제18조제5항","q":[{"q":"총회 의결사항이 아닌 것은?","o":["정관 변경","기본재산 처분","결산보고서 승인","개별 여신 심사"],"a":3,"x":"개별 여신 심사는 법 제12조제4항의 총회 의결사항으로 열거되어 있지 않습니다."}],"trap":"이사장 선출방식은 법 제18조의 예외를 함께 봅니다.","hook":"총회 = 정관·존립·임원·기본재산·결산·계획예산·경비.","one":"정관 변경"}},{"id":"c23","n":23,"t":"총회의 종류","card":{"s":["정기총회 — 매년 1회 정관으로 정하는 바에 따라 소집","임시총회 — 필요하다고 인정할 때 소집","총회는 회원으로 구성하고 이사장이 소집","회원 3분의 1 이상 동의로 임시총회 소집 요구 가능","감사는 감사 결과 부정한 사실을 신속히 보고할 필요가 있을 때 소집 요구 가능","회장은 지도·감독상 필요한 경우 임시총회 소집 요구 가능"],"e":"현행 법률은 정기총회를 매년 1회 열도록 하되 구체적인 소집 시점은 정관에 맡깁니다. 따라서 “사업연도 종료 후 2개월 이내”라는 숫자를 법률 규정으로 외우면 안 됩니다. 결산보고서 승인 등은 정기총회의 핵심 의제입니다.","k":"정기총회 일정은 해당 금고 정관을 확인해야 합니다. 법률상 확실한 기준은 매년 1회 정관으로 정하는 바에 따라 소집한다는 점입니다.","l":"새마을금고법 제12조제2항·제3항, 제14조","q":[{"q":"현행 새마을금고법상 정기총회 소집 기준으로 옳은 것은?","o":["매년 1회 정관으로 정하는 바에 따라 소집","사업연도 종료 후 반드시 1개월 이내","사업연도 종료 후 반드시 2개월 이내","3년에 1회 개최"],"a":0,"x":"법 제12조제2항은 정기총회를 매년 1회 정관으로 정하는 바에 따라 소집하도록 합니다."}],"one":"정기총회 — 매년 1회 정관으로 정하는 바에 따라 소집"}},{"id":"c24","n":24,"t":"총회 소집 절차","card":{"s":["① 소집 결정 — 이사장 또는 소집권자의 총회 소집 결정","② 소집 공고 — 총회 개최일 7일 전까지 회의 목적사항 등 공고","③ 총회 개최 — 정족수 충족 시 개의, 안건 심의·의결","④ 의사록 작성 — 총회 의사록 작성 및 보존"],"e":"공고 기한 7일과 공고 내용(회의 목적사항)이 핵심입니다. 공고에 없던 안건을 당일에 올려 의결하면 나중에 무효 주장이 나올 수 있습니다.","k":"공고에 “정관 변경”만 적어두고 당일에 “임원 해임”을 추가로 의결하면 절차 하자의 소지가 있습니다.","l":"새마을금고법 제15조제2항, 시행령 제5조","q":[{"q":"총회 소집 공고 기한은?","o":["개최일 3일 전까지","개최일 7일 전까지","개최일 10일 전까지","개최일 14일 전까지"],"a":1,"x":"총회 개최일 7일 전까지 회의 목적사항 등을 공고해야 합니다."}],"one":"① 소집 결정 — 이사장 또는 소집권자의 총회 소집 결정"}},{"id":"c25","n":25,"t":"총회의 의결정족수","card":{"s":["일반의결 — 재적회원 과반수 출석, 출석회원 과반수 찬성","회원 500명 초과 금고 — 251명 이상 출석으로 개의 가능","특별의결 — 정관 변경, 해산·합병·휴업은 출석 요건을 갖추고 출석회원 3분의 2 이상 찬성","공고된 회의 목적사항만 의결하는 것이 원칙 — 긴급한 경우 법정 특례 있음"],"e":"정족수는 두 단계입니다. “몇 명이 와야 회의가 성립하는가(의사정족수)”와 “몇 명이 찬성해야 통과되는가(의결정족수)”. 중요한 안건일수록 찬성 기준만 3분의 2로 올라갑니다.","k":"재적 400명 금고는 201명이 출석해야 개의됩니다. 정관 변경은 출석 201명 중 134명 이상이 찬성해야 통과됩니다.","l":"새마을금고법 제13조","q":[{"q":"정관 변경에 필요한 찬성 요건은?","o":["출석회원 과반수","출석회원 3분의 2 이상","재적회원 3분의 2 이상","전원 찬성"],"a":1,"x":"정관 변경은 특별의결 사항으로, 출석회원 3분의 2 이상의 찬성이 필요합니다."}],"one":"일반의결 — 재적회원 과반수 출석, 출석회원 과반수 찬성"}}]},{"id":"D3","t":"대의원회","c":[{"id":"c26","n":26,"t":"대의원회","card":{"s":["회원이 500명을 초과하는 금고는 총회를 갈음할 대의원회를 둘 수 있음","대의원회는 이사장과 대의원으로 구성","대의원 자격은 정관으로 정하되 원칙적으로 회원 가입 후 1년이 지난 자","대의원 수는 회원 수에 비례하여 정관으로 정하되 100명 이상","대의원 임기는 3년","대의원회에는 총회에 관한 규정을 준용"],"e":"대의원회는 회원 수가 많은 금고에서 총회를 function layout(){
  let cursor=20;
  (function walk(n,d){
    n.depth=d;
    const open=(d===0)||(expanded.has(n.id)&&n.c&&n.c.length);
    if(open && n.c && n.c.length){
      n.c.forEach(k=>walk(k,d+1));
      n.y=(n.c[0].y+n.c[n.c.length-1].y)/2;
    }else{
      const h=SLOT[d]||56;
      n.y=cursor+h/2; cursor+=h+(GAPD[d]||8);
    }
  })(DATA,0);
  return cursor;
}

function nodeHTML(n){
  const open=expanded.has(n.id)&&n.c&&n.c.length;
  let html=`<div class="node d${n.depth}${n.depth===3&&sheetOpenId===n.id?' active':''}" style="--ac:${accOf(n)};--ac2:${acc2Of(n)}" data-id="${n.id}">`;
  if(n.depth===0){
    html+=`<div><span class="txt">${n.t}</span><div class="sub">${n.sub}</div></div>`;
  }else if(n.depth===1){
    html+=`<span class="txt">${n.t}</span><span class="cnt">${count(n)}</span>`;
  }else if(n.depth===2){
    html+=`<span class="dot"></span><span class="txt">${n.t}</span>`;
  }else{
    html+=`<span class="sn">${n.n}</span><span class="txt">${n.t}</span>`;
  }
  if(n.c){
    html+=`<div class="toggle${open?' open':''}">${open?'−':'+'}</div>`;
  }else{
    html+=`<div class="toggle" style="border-color:${accOf(n)}">›</div>`;
  }
  html+=`</div>`;
  return html;
}

function bez(x1,y1,x2,y2){
  const dx=Math.max(60,(x2-x1)*.55);
  return `M${x1} ${y1} C${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
}

      stepIndex=stepIdxOf[n.id]; updateStepBadge();
      if(n.c){ expanded.has(n.id)?collapseNode(n):expanded.add(n.id); if(n.depth===1) setFocus(n.id); drawDesktop(true); scheduleFit(); }
      else openSheet(n);
    };
    el.onclick=act;
    el.tabIndex=0;
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}};
  });

  // wires
  let svg='';
  order.forEach(n=>{
    if(!expanded.has(n.id)||!n.c) return;
    n.c.forEach(k=>{
      const w1=nodeMeasuredW(n), x1=COLX[n.depth]+w1+13, y1=n.y;
      const x2=COLX[k.depth]-2, y2=k.y;
      const dim=focusBranch&&k.br&&k.br!==focusBranch;
      svg+=`<path class="wire${dim?' dim':''}" d="${bez(x1,y1,x2,y2)}" stroke-width="${k.depth===1?2.6:1.8}" style="stroke:${accOf(k)};stroke-dasharray:1200;stroke-dashoffset:${animate?1200:0};animation:${animate?'drawLine .7s var(--ease) forwards':'none'};animation-delay:${animate?'80ms':'0ms'}"/>`;
    });
  });
  wires.innerHTML=svg;
  wires.setAttribute('width',COLX[3]+420);
  wires.setAttribute('height',Math.max(totalH+40,700));

  // 실제 렌더 폭 재측정 후 wire 재계산 (auto-width라 1프레임 뒤 보정)
  requestAnimationFrame(()=>{
    let svg2='';
    order.forEach(n=>{
      if(!expanded.has(n.id)||!n.c) return;
      n.c.forEach(k=>{
        const w1=nodeMeasuredW(n), x1=COLX[n.depth]+w1+13, y1=n.y;
        const x2=COLX[k.depth]-2, y2=k.y;
        const dim=focusBranch&&k.br&&k.br!==focusBranch;
        svg2+=`<path class="wire${dim?' dim':''}" d="${bez(x1,y1,x2,y2)}" style="stroke:${accOf(k)};stroke-width:${k.depth===1?2.6:1.8}"/>`;
      });
    });
    wires.innerHTML=svg2;
  });
}
function nodeBox(n){
  const el=world.querySelector('.nodewrap .node[data-id="'+n.id+'"]');
  if(el) return {w:el.offsetWidth,h:el.offsetHeight};
  return {w:n.depth===0?260:n.depth===1?190:n.depth===2?190:230,
           h:n.depth===0?76:n.depth===1?58:n.depth===2?50:50};
}
function nodeMeasuredW(n){ return nodeBox(n).w; }
function collapseNode(n){ expanded.delete(n.id); (n.c||[]).forEach(collapseNode); if(focusBranch===n.id) clearFocus(); }

/* ── 포커스(브랜치 집중) ── */
function setFocus(id){ focusBranch=id; document.getElementById('unfocus').classList.add('on'); }
function clearFocus(){ focusBranch=null; document.getElementById('unfocus').classList.remove('on'); }
document.getElementById('unfocus').onclick=()=>{clearFocus();stepIndex=0;updateStepBadge();drawDesktop(true);scheduleFit();};

/* ══════════════ Auto-Fit 엔진 ══════════════
   클릭 · 확장 · 포커스 · 리사이즈 · 전체화면 전환마다
   "지금 봐야 할 노드들"을 계산해 화면 가득 자동으로 맞춘다. */
function availableRect(){
  const header=document.querySelector('header').offsetHeight;
  let sheetW=0;
  if(sheet.classList.contains('on')) sheetW=sheet.offsetWidth;
  const padX=36, padTop=20, padBottom=54;
  const w=Math.max(240, innerWidth - sheetW - padX*2);
  const h=Math.max(220, innerHeight - header - padTop - padBottom);
  return {x:padX, y:header+padTop, w, h};
}
function boundsOf(nodes){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(n=>{
    const b=nodeBox(n);
    const x0=COLX[n.depth], x1=x0+b.w+18;
    const y0=n.y-b.h/2, y1=n.y+b.h/2;
    if(x0<minX)minX=x0; if(x1>maxX)maxX=x1;
    if(y0<minY)minY=y0; if(y1>maxY)maxY=y1;
  });
  return {minX,minY,maxX,maxY};
}
function currentFitSet(){
  if(focusBranch){
    const b=byId[focusBranch];
    const nodes=[DATA,b];
    (function collect(n){ (n.c||[]).forEach(k=>{ if(expanded.has(n.id)){ nodes.push(k); collect(k); } }); })(b);
    return nodes;
  }
  const nodes=[];
  (function collect(n){ nodes.push(n); if(expanded.has(n.id)||n.depth===0) (n.c||[]).forEach(collect); })(DATA);
  return nodes;
}
let fitRaf=null;
function scheduleFit(instant){
  if(isMobile()) return;
  cancelAnimationFrame(fitRaf);
  fitRaf=requestAnimationFrame(()=>{
    const nodes=currentFitSet();
    if(!nodes.length) return;
    const {minX,minY,maxX,maxY}=boundsOf(nodes);
    const rect=availableRect();
    const bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY);
    let s=Math.min(rect.w/bw, rect.h/bh);
    s=Math.max(MIN_S, Math.min(MAX_S, s));
    if(instant) world.classList.add('instant');
    view.s=s;
    view.x=rect.x + rect.w/2 - (minX+maxX)/2*s;
    view.y=rect.y + rect.h/2 - (minY+maxY)/2*s;
    apply();
    if(instant) requestAnimationFrame(()=>requestAnimationFrame(()=>world.classList.remove('instant')));
  });
}
function home(){ scheduleFit(true); } // 구버전 호출부 대응용 별칭

/* 팬 · 휠줌 · 핀치줌(터치) */
let drag=null;
const pointers=new Map();
let pinch=null;
stage.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    drag=null; world.classList.add('instant');
    const pts=[...pointers.values()];
    pinch={dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),scale:view.s,
           cx:(pts[0].x+pts[1].x)/2, cy:(pts[0].y+pts[1].y)/2};
  }else if(pointers.size===1){
    if(e.target.closest('.node')||e.target.closest('.toggle'))return;
    world.classList.add('instant');
    drag={px:e.clientX,py:e.clientY,x:view.x,y:view.y};
    stage.classList.add('drag');
  }
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
});
stage.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && pointers.size===2){
    const pts=[...pointers.values()];
    const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    const ns=Math.min(MAX_S,Math.max(MIN_S,pinch.scale*(dist/pinch.dist)));
    const r=stage.getBoundingClientRect(), mx=pinch.cx-r.left, my=pinch.cy-r.top;
    view.x=mx-(mx-view.x)*(ns/view.s); view.y=my-(my-view.y)*(ns/view.s); view.s=ns; apply();
    return;
  }
  if(!drag)return;
  view.x=drag.x+(e.clientX-drag.px); view.y=drag.y+(e.clientY-drag.py); apply();
});
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,e=>{
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(pointers.size===0){ drag=null; stage.classList.remove('drag'); setTimeout(()=>world.classList.remove('instant'),50); }
}));
stage.addEventListener('wheel',e=>{
  e.preventDefault(); world.classList.add('instant');
  const f=Math.exp(-e.deltaY*0.0012), ns=Math.min(MAX_S,Math.max(MIN_S,view.s*f));
  const r=stage.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  view.x=mx-(mx-view.x)*(ns/view.s); view.y=my-(my-view.y)*(ns/view.s); view.s=ns; apply();
  clearTimeout(stage._t); stage._t=setTimeout(()=>world.classList.remove('instant'),120);
},{passive:false});
function apply(){ world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`; }
function zoom(f){
  const ns=Math.min(MAX_S,Math.max(MIN_S,view.s*f)), cx=innerWidth/2, cy=innerHeight/2;
  view.x=cx-(cx-view.x)*(ns/view.s); view.y=cy-(cy-view.y)*(ns/view.s); view.s=ns; apply();
}

/* 전체화면 */
const btnFull=document.getElementById('btnFull');
const canFS=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
if(!canFS) btnFull.style.display='none';
btnFull.onclick=()=>{
  const de=document.documentElement;
  const isFs=document.fullscreenElement||document.webkitFullscreenElement;
  if(!isFs){ (de.requestFullscreen||de.webkitRequestFullscreen).call(de).catch(()=>{}); }
  else{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
};
function onFsChange(){
  const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement);
  btnFull.classList.toggle('on',isFs);
  btnFull.setAttribute('aria-label',isFs?'전체화면 종료':'전체화면');
  setTimeout(()=>scheduleFit(true),80);
}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);

/* 화면 맞춤 수동 버튼 */
document.getElementById('btnFit').onclick=()=>{ world.classList.remove('instant'); scheduleFit(); };

/* ══════════════ 프레젠터 클리커(로지텍 Spotlight 등) 내비게이션 ══════════════
   다음/이전 버튼(→/←, PageDown/Up, Space)만으로 화면을 조준하지 않고도
   가지→카테고리→카드 순서대로 자동 드릴다운/백 이동한다. */
function goToStep(idx){
  if(isMobile()) return;
  idx=Math.max(0,Math.min(STEPS.length-1,idx));
  stepIndex=idx;
  const n=STEPS[idx];
  let p=parentOf[n.id];
  while(p){ expanded.add(p.id); p=parentOf[p.id]; }
  if(n.br) setFocus(n.br); else clearFocus();
  if(n.c){
    expanded.add(n.id);
    drawDesktop(true);
    scheduleFit();
  }else{
    drawDesktop(true);
    openSheet(n);
  }
  updateStepBadge();
}
function updateStepBadge(){
  const el=document.getElementById('stepBadge');
  if(!el) return;
  const n=STEPS[stepIndex];
  el.innerHTML=`<b>${stepIndex+1}</b> / ${STEPS.length} <span>${n.t}</span>`;
}
/* 두 번 빠르게 누르면(더블탭) 카드 단위를 건너뛰고 다음/이전 카테고리·영역으로 이동 */
function skipStep(dir){
  let idx=stepIndex;
  do{ idx+=dir; }while(idx>0 && idx<STEPS.length-1 && STEPS[idx].depth===3);
  goToStep(idx);
  flashSkip(dir);
}
function flashSkip(dir){
  const el=document.getElementById('stepBadge');
  if(!el) return;
  el.classList.remove('skip-fwd','skip-back');
  void el.offsetWidth;
  el.classList.add(dir>0?'skip-fwd':'skip-back');
}

/* ══════════════ 모바일 드릴다운 ══════════════ */
let path=['root'];
function drawMobile(){
  const cur=byId[path[path.length-1]];
  const cr=document.getElementById('crumb');
  cr.innerHTML = path.length>1
    ? `<button class="back">‹ ${byId[path[path.length-2]].t}</button>`
    : `<span>전체 개요</span>`;
  if(path.length>1) cr.querySelector('.back').onclick=()=>{path.pop();drawMobile();document.getElementById('mobile').scrollTop=0};
  document.getElementById('mtitle').textContent=cur.t;
  document.getElementById('mdesc').textContent=
    cur.id==='root' ? '영역을 눌러 단계별로 좁혀 들어가세요. 마지막 카드에서 원문·쉬운 말 풀이·사례·퀴즈를 볼 수 있습니다.'
    : `${count(cur)}개 학습카드`;
  const list=document.getElementById('mlist'); list.innerHTML='';
  (cur.c||[]).forEach((k,i)=>{
    const row=document.createElement('div'); row.className='mrow'; row.tabIndex=0;
    row.style.setProperty('--ac',accOf(k)); row.style.animationDelay=(i*35)+'ms';
    row.innerHTML=`<span class="bar"></span><span class="mt">${k.t}</span><span class="mc">${k.c?count(k):k.n}</span><span class="ar">›</span>`;
    const act=()=>{ if(k.c){path.push(k.id);drawMobile();document.getElementById('mobile').scrollTop=0;} else openSheet(k); };
    row.onclick=act;
    row.onkeydown=e=>{if(e.key==='Enter'){act()}};
    list.appendChild(row);
  });
}

/* ══════════════ 상세 시트 ══════════════ */
const sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
function openSheet(n){
  sheetOpenId=n.id;
  const c=n.card, p=parentOf[n.id];
  sheet.style.setProperty('--ac',accOf(n));
  document.getElementById('shEye').textContent=`${byId[parentOf[p.id].id].t} · ${p.t}`;
  document.getElementById('shTitle').textContent=n.t;
  const body=document.getElementById('shBody');
  body.innerHTML=`
    <div class="blk"><h4>핵심 요약 · 교안 원문</h4><ul>${c.s.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="blk"><h4>쉬운 말 풀이</h4><p class="easy">${c.e}</p></div>
    <div class="blk"><h4>현장 사례</h4><p class="case">${c.k}</p></div>
    ${c.trap?`<div class="blk"><h4>헷갈림 주의</h4><p class="case">${c.trap}</p></div>`:''}
    ${c.hook?`<div class="blk"><h4>암기 포인트</h4><p class="easy">${c.hook}</p></div>`:''}
    ${c.l?`<div class="blk"><h4>근거 조문</h4><span class="lawtag">${c.l}</span>
      <p class="note">${COURSE.meta.legalBasis}. ${COURSE.meta.disclaimer}</p></div>`:''}
    <div class="blk"><h4>확인 퀴즈</h4>
      <p class="q">${c.q.q}</p>
      <div class="opts">${c.q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
      <p class="qx" id="qx">${c.q.x}</p>
    </div>`;
  body.querySelectorAll('.opt').forEach(b=>{
    b.onclick=(ev)=>{
      const i=+b.dataset.i, ok=i===c.q.a;
      body.querySelectorAll('.opt').forEach(o=>{
        o.disabled=true;
        if(+o.dataset.i===c.q.a) o.classList.add('ok');
      });
      if(!ok) b.classList.add('no');
      else burstAt(ev.clientX,ev.clientY,accOf(n));
      body.querySelector('#qx').classList.add('on');
    };
  });
  body.scrollTop=0;
  sheet.classList.add('on'); scrim.classList.add('on');
  document.getElementById('shClose').focus();
  if(!isMobile()){ drawDesktop(false); scheduleFit(); }
}
function closeSheet(){
  sheetOpenId=null;
  sheet.classList.remove('on'); scrim.classList.remove('on');
  if(!isMobile()){ drawDesktop(false); scheduleFit(); }
}
scrim.onclick=closeSheet;
document.getElementById('shClose').onclick=closeSheet;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(sheet.classList.contains('on')) closeSheet(); else if(focusBranch){clearFocus();drawDesktop(true);scheduleFit();} }
  if(!isMobile() && /^[1-5]$/.test(e.key)){
    const b=byId[BR[+e.key-1]];
    expanded.add(b.id); setFocus(b.id); stepIndex=stepIdxOf[b.id]; updateStepBadge();
    drawDesktop(true); scheduleFit();
  }
  if(e.key.toLowerCase()==='f') document.getElementById('btnPresent').click();

  if(isMobile()) return;
  const fwd = e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'||(e.code==='Space'&&!e.shiftKey);
  const back = e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'||e.key==='Backspace'||(e.code==='Space'&&e.shiftKey);
  const now=Date.now();
  if(fwd){
    e.preventDefault();
    if(now-lastFwdTime<420){ lastFwdTime=0; skipStep(+1); }
    else{ lastFwdTime=now; goToStep(stepIndex+1); }
  }else if(back){
    e.preventDefault();
    if(now-lastBackTime<420){ lastBackTime=0; skipStep(-1); }
    else{ lastBackTime=now; goToStep(stepIndex-1); }
  }
  else if(e.key==='Home'){ e.preventDefault(); goToStep(0); }
  else if(e.key==='End'){ e.preventDefault(); goToStep(STEPS.length-1); }
});

/* 정답 파티클 */
function burstAt(x,y,color){
  const wrap=document.createElement('div'); wrap.className='burstwrap'; document.body.appendChild(wrap);
  for(let i=0;i<14;i++){
    const p=document.createElement('div'); p.className='p';
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*70;
    p.style.left=x+'px'; p.style.top=y+'px';
    p.style.background=color;
    p.style.setProperty('--tx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--ty',Math.sin(ang)*dist+'px');
    p.style.animationDelay=(Math.random()*60)+'ms';
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.remove(),900);
}

/* ══════════════ 컨트롤 ══════════════ */
document.getElementById('btnIn').onclick=()=>{world.classList.remove('instant');zoom(1.22)};
document.getElementById('btnOut').onclick=()=>{world.classList.remove('instant');zoom(1/1.22)};
document.getElementById('btnExpand').onclick=function(){
  const allOpen=expanded.size>10;
  if(allOpen){ expanded.clear(); expanded.add('root'); this.textContent='모두 펼치기'; }
  else{ (function w(n){ if(n.c){expanded.add(n.id);n.c.forEach(w);} })(DATA); this.textContent='모두 접기'; }
  clearFocus();
  if(isMobile()) drawMobile(); else { drawDesktop(true); scheduleFit(); }
};
document.getElementById('btnReset').onclick=()=>{
  expanded.clear(); expanded.add('root'); path=['root']; clearFocus(); stepIndex=0; updateStepBadge();
  document.getElementById('btnExpand').textContent='모두 펼치기';
  closeSheet();
  if(isMobile()){drawMobile();document.getElementById('mobile').scrollTop=0;} else {drawDesktop(true);scheduleFit();}
};
document.getElementById('btnPresent').onclick=function(){
  PRESENT=!PRESENT;
  document.body.classList.toggle('present',PRESENT);
  this.classList.toggle('on',PRESENT);
  this.textContent=PRESENT?'🎤 발표모드 종료':'🎤 발표모드';
  if(!isMobile()){ scheduleFit(); }
};

/* 범례 */
const LEGLABEL={A:'① 법의 기초',B:'② 설립',C:'③ 회원·출자',D:'④ 기관',E:'⑤ 임원'};
function buildLegend(){
  const wrap=document.getElementById('legend'); wrap.innerHTML='';
  BR.forEach((b,i)=>{
    const btn=document.createElement('button'); btn.className='leg';
    btn.style.background=`var(${HUE[b][0]})`; btn.style.color='#fff';
    btn.textContent=(i+1)+'  '+LEGLABEL[b];
    btn.style.background=`var(${HUE[b][0]})`;
    btn.onclick=()=>{
      if(isMobile()){ path=['root',b]; drawMobile(); document.getElementById('mobile').scrollTop=0; return; }
      const node=byId[b]; expanded.add(node.id); setFocus(node.id); stepIndex=stepIdxOf[b]; updateStepBadge();
      drawDesktop(true); scheduleFit();
    };
    wrap.appendChild(btn);
  });
}

/* 최초 힌트 자동 숨김 */
setTimeout(()=>document.getElementById('hint').classList.add('hide'),6000);

function render(){
  buildLegend();
  if(isMobile()){
    stage.style.display='none'; document.getElementById('mobile').style.display='block';
    document.getElementById('hint').style.display='none';
    document.getElementById('unfocus').style.display='none';
    document.getElementById('stepBadge').style.display='none';
    drawMobile();
  }else{
    stage.style.display='block'; document.getElementById('mobile').style.display='none';
    document.getElementById('hint').style.display='';
    document.getElementById('unfocus').style.display='';
    document.getElementById('stepBadge').style.display='flex';
    drawDesktop(true);
    updateStepBadge();
  }
}
let mq=window.matchMedia('(max-width:640px)'), wasM=mq.matches;
let resizeT=null;
addEventListener('resize',()=>{
  if(mq.matches!==wasM){ wasM=mq.matches; render(); if(!wasM) home(); return; }
  if(!isMobile()){ clearTimeout(resizeT); resizeT=setTimeout(()=>scheduleFit(true),100); }
});
addEventListener('orientationchange',()=>{ setTimeout(()=>{ if(!isMobile()) scheduleFit(true); },150); });
render();
if(!isMobile()) scheduleFit(true);
</script>
